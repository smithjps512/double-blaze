<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | Find Me</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff8f0; color: #1e1b18; font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
      h1 { font-family: Georgia, serif; font-size: 2rem; margin: 16px 0 8px; }
      p { color: #5f584f; max-width: 28rem; }
      button { margin-top: 16px; background: #d9481f; color: #fff; border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 600; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" width="64" height="64" />
      <h1>You are offline</h1>
      <p>Find Me needs a connection to show pets that are still available. Try again when you are back online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
