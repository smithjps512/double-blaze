<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f110f">
<title>TrailRiders</title>
<meta name="description" content="A working demo of TrailRiders, built from the Chicken.nugg team's user stories and Figma prototype.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f110f; --card: #1a1d1a; --raised: #242a24; --line: #2a302a; --line2: #3d453d;
    --text: #f5f6f5; --muted: #a3aaa3; --quiet: #6b726b; --orange: #ff5a00; --orange2: #ef6c00;
    --green: #3e6b35; --green2: #4caf50; --red: #e57373; --cyan: #4fd1c5;
    --caps: "Archivo", system-ui, sans-serif; --body: "DM Sans", system-ui, sans-serif;
    --tabs: 74px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #070807; color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; }
  body { min-height: 100dvh; display: flex; justify-content: center; }
  .app { position: relative; width: 100%; max-width: 430px; min-height: 100dvh; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  @media (min-width: 700px) { .app { min-height: 100vh; border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
  main { flex: 1; padding: max(16px, env(safe-area-inset-top)) 16px calc(var(--tabs) + 24px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  main.no-tabs { padding-bottom: 24px; }
  h1, h2, h3, .caps { font-family: var(--caps); text-transform: uppercase; letter-spacing: -0.01em; margin: 0; }
  h1 { font-size: 34px; font-weight: 900; line-height: 1.05; }
  h2 { font-size: 15px; font-weight: 800; margin: 22px 0 10px; }
  h3 { font-size: 17px; font-weight: 800; }
  p { margin: 0; line-height: 1.5; }
  .muted { color: var(--muted); } .quiet { color: var(--quiet); }
  .eyebrow { font-family: var(--caps); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--quiet); font-weight: 700; }
  .value { font-family: var(--caps); font-size: 20px; font-weight: 800; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .card.big { border-radius: 18px; padding: 16px; }
  .card.tap { cursor: pointer; } .card.tap:active { background: var(--raised); }
  .pill { font-family: var(--caps); text-transform: uppercase; font-weight: 800; font-size: 15px; letter-spacing: 0.02em; color: #fff; background: var(--orange); border: 0; border-radius: 999px; height: 52px; padding: 0 22px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
  .pill:active { background: var(--orange2); }
  .pill.dark { background: var(--raised); border: 1px solid var(--line2); color: var(--text); }
  .pill.small { height: 40px; font-size: 12px; width: auto; padding: 0 16px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; font-family: var(--caps); text-transform: uppercase; font-weight: 800; font-size: 12px; letter-spacing: 0.04em; color: var(--muted); background: var(--raised); border: 1px solid var(--line2); border-radius: 999px; padding: 10px 16px; cursor: pointer; }
  .chip.active { background: var(--orange); border-color: var(--orange); color: #fff; }
  .chip.green { background: var(--green); border-color: var(--green); color: #fff; }
  .badge { font-family: var(--caps); text-transform: uppercase; font-weight: 800; font-size: 11px; letter-spacing: 0.04em; padding: 5px 10px; border-radius: 8px; display: inline-block; }
  .badge.expert { color: var(--red); background: rgba(229,115,115,.15); }
  .badge.intermediate { color: #ffb36b; background: rgba(255,90,0,.15); }
  .badge.beginner { color: #8bd17c; background: rgba(76,175,80,.15); }
  .field { width: 100%; background: var(--card); border: 1px solid var(--line2); border-radius: 12px; color: var(--text); font: 16px var(--body); padding: 14px; outline: none; }
  .field::placeholder { color: var(--quiet); }
  .field:focus { border-color: var(--orange); }
  textarea.field { min-height: 90px; resize: vertical; }
  label.lbl { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  .error { color: var(--red); font-size: 14px; margin-top: 8px; }
  .search { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line2); border-radius: 999px; padding: 0 16px; height: 54px; }
  .search input { flex: 1; background: transparent; border: 0; color: var(--text); font: 16px var(--body); outline: none; min-width: 0; }
  .search input::placeholder { color: var(--quiet); }
  .icon { width: 22px; height: 22px; flex: 0 0 auto; }
  .icon-btn { width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(26,29,26,.9); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .photo { background: radial-gradient(120% 90% at 20% 0%, #1e2a1e 0%, #141a14 45%, #0c0e0c 100%); border-radius: 12px; position: relative; overflow: hidden; }
  .photo::after { content: ""; position: absolute; inset: 0; background: repeating-radial-gradient(circle at 70% 60%, transparent 0 22px, rgba(255,255,255,.035) 22px 23px); }
  .photo .lab { position: absolute; top: 10px; left: 12px; font-size: 12px; color: var(--quiet); letter-spacing: .06em; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); }
  .stats > div { padding: 12px 8px; text-align: center; }
  .stats > div + div { border-left: 1px solid var(--line); }
  .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--tabs) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--card); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); }
  .tabs button { background: transparent; border: 0; color: var(--muted); font: 600 12px var(--body); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
  .tabs button.active { color: var(--orange); }
  .fab { position: absolute; right: 18px; bottom: calc(var(--tabs) + 18px + env(safe-area-inset-bottom)); width: 60px; height: 60px; border-radius: 999px; background: var(--orange); border: 0; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(255,90,0,.35); cursor: pointer; }
  .home { min-height: 100dvh; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px 20px 40px; background: radial-gradient(140% 80% at 50% 0%, #243024 0%, #151a15 40%, #0f110f 75%); position: relative; }
  .home .mark { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); }
  .home h1 { font-size: 44px; text-align: center; }
  .home h1 span { color: var(--orange); }
  .home .tag { text-align: center; font-family: var(--caps); font-weight: 800; text-transform: uppercase; color: var(--muted); font-size: 16px; margin: 10px 0 12px; }
  .home p.lead { text-align: center; color: var(--muted); font-size: 16px; }
  .ring { position: relative; height: 320px; border-radius: 18px; overflow: hidden; background: radial-gradient(circle at 50% 45%, #1b201b 0, #131613 40%, #0f110f 100%); border: 1px solid var(--line); }
  .ring::before { content: ""; position: absolute; inset: -40%; background: repeating-radial-gradient(circle at 50% 50%, transparent 0 26px, rgba(255,255,255,.05) 26px 27px); }
  .pin { position: absolute; width: 30px; height: 30px; border-radius: 999px; border: 2px solid var(--line2); background: rgba(15,17,15,.8); display: flex; align-items: center; justify-content: center; }
  .pin i { width: 10px; height: 10px; border-radius: 999px; background: var(--orange); display: block; }
  .pin.g i { background: var(--green2); }
  .trail-tag { position: absolute; white-space: nowrap; max-width: 80%; overflow: hidden; text-overflow: ellipsis; background: var(--orange); color: #fff; font-family: var(--caps); text-transform: uppercase; font-weight: 800; font-size: 13px; border-radius: 999px; padding: 12px 16px; display: flex; gap: 8px; align-items: center; box-shadow: 0 8px 24px rgba(255,90,0,.3); cursor: pointer; }
  .list-item { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 46px; height: 46px; border-radius: 999px; background: linear-gradient(135deg, #2b352b, #151a15); border: 1px solid var(--line2); flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-family: var(--caps); font-weight: 800; color: var(--muted); }
  .avatar.big { width: 120px; height: 120px; border: 3px solid var(--orange); font-size: 34px; }
  .thumb { width: 52px; height: 52px; border-radius: 12px; background: rgba(62,107,53,.25); display: flex; align-items: center; justify-content: center; color: var(--green2); flex: 0 0 auto; }
  .speed { border: 1.5px solid var(--orange); border-radius: 18px; padding: 24px 16px; text-align: center; background: var(--card); }
  .speed .n { font-family: var(--caps); font-weight: 900; font-size: 84px; color: var(--orange); line-height: 1; margin: 8px 0; }
  .speed .u { font-family: var(--caps); font-weight: 800; font-size: 20px; text-transform: uppercase; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; background: var(--raised); border: 1px solid var(--line2); line-height: 1.4; }
  .bubble.me { background: var(--orange); border-color: var(--orange); color: #fff; align-self: flex-end; }
  .msgs { display: flex; flex-direction: column; gap: 8px; }
  .composer { display: flex; gap: 8px; margin-top: 14px; }
  .composer .field { flex: 1; border-radius: 999px; }
  .composer button { width: 52px; height: 52px; border-radius: 999px; border: 0; background: var(--orange); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto; }
  .ach { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .ach > div { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; border: 1px solid var(--line2); border-radius: 999px; padding: 12px 16px; font-family: var(--caps); font-weight: 800; font-size: 13px; text-transform: uppercase; color: var(--text); }
  .ach > div.locked { color: var(--quiet); border-style: dashed; }
  .ach svg { color: var(--orange); } .ach .locked svg { color: var(--quiet); }
  .toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabs) + 24px); background: var(--raised); border: 1px solid var(--line2); color: var(--text); padding: 12px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; max-width: 90%; text-overflow: ellipsis; overflow: hidden; }
  .toast.show { opacity: 1; }
  .link { color: var(--orange); background: none; border: 0; font: 600 14px var(--body); cursor: pointer; padding: 0; }
  .sticky-bottom { position: sticky; bottom: 0; padding-top: 12px; background: linear-gradient(transparent, var(--bg) 30%); }
  .hero { height: 220px; margin: -16px -16px 16px; background: radial-gradient(120% 100% at 30% 0%, #2a3a2a 0%, #1a221a 45%, var(--bg) 100%); position: relative; }
  .hero .top { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; justify-content: space-between; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .listing .photo { height: 120px; margin-bottom: 10px; }
  .price { font-family: var(--caps); font-weight: 900; font-size: 22px; }
  .add { width: 44px; height: 44px; border-radius: 12px; background: var(--orange); border: 0; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .empty { text-align: center; color: var(--quiet); padding: 30px 10px; line-height: 1.5; }
  .note { border-left: 3px solid var(--orange); padding: 10px 12px; background: var(--card); border-radius: 0 12px 12px 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .dots { color: var(--quiet); letter-spacing: 2px; }
  .kv { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .kv:last-child { border-bottom: 0; }
  .hidden { display: none !important; }
</style>
</head>

/* ---- Ride tracking (simulated) ---- */
let ride = null;
function startRide(id) {
  const t = TRAILS.find((x) => x.id === id);
  ride = { trail: t, seconds: 0, miles: 0, speed: 0, samples: [], paused: false, timer: null, done: false };
  ride.timer = setInterval(tickRide, 1000);
  go("ride");
}
function tickRide() {
  if (!ride || ride.paused || ride.done) return;
  ride.seconds += 1;
  const target = ride.trail.level === "expert" ? 9 : ride.trail.level === "intermediate" ? 11 : 12;
  ride.speed = Math.max(3, Math.min(19, ride.speed + (Math.random() - 0.5) * 3 + (target - ride.speed) * 0.08));
  ride.miles += ride.speed / 3600 * 12; // twelve times real time so a demo ride takes a minute, not an hour
  ride.samples.push(ride.speed); if (ride.samples.length > 40) ride.samples.shift();
  if (view.name === "ride") updateRide();
}
function updateRide() {
  $("spd").textContent = ride.speed.toFixed(1); $("dist").textContent = `${ride.miles.toFixed(1)} mi`; $("tm").textContent = fmtTime(ride.seconds);
  const w = 340, h = 150, n = ride.samples.length;
  $("line").setAttribute("points", ride.samples.map((v, i) => `${n > 1 ? (i / (n - 1)) * w : 0},${h - 10 - (v / 20) * (h - 20)}`).join(" "));
}

function finishRide() {

  return `

    <div id="err" class="error"></div>

  <p class="quiet" style="font-size:12px;margin-top:16px">The coach in this demo answers from a small table the team writes. It is not a doctor. Pain that gets worse, dizziness or a knock to the head: stop riding and tell an adult.</p>`;
};
function askCoach() {
  const q = $("q").value.trim();
  if (!q) return ($("err").textContent = "Type a question first.");
  if (coachLeft() === 0) return render();
  const lower = q.toLowerCase();
  const hit = COACH.find((c) => c.keys.some((k) => lower.includes(k)));
  S.coach.log.unshift({ q, a: hit ? hit.a : COACH_DEFAULT });
  S.coach.count += 1;
  if (S.coach.count >= 5) S.coach.lockedUntil = Date.now() + LOCK_HOURS * 36e5;
  save(); render();
}

  ${S.rides.length ? `<h2>Last ride</h2><div class="card"><div class="list-item"><div class="thumb">${ICONS.pin}</div><div style="flex:1"><div style="font-weight:600">${esc(S.rides[0].trail)}</div><div class="quiet" style="font-size:13px">${fmtDate(S.rides[0].when)} &bull; ${fmtLong(S.rides[0].seconds)}</div></div><div class="value" style="font-size:17px">${S.rides[0].miles} mi</div></div></div>` : ""}
  <h2>Start a session</h2>
  <div class="stack">${TRAILS.map((t) => `<div class="card tap" onclick="startRide('${t.id}')"><div class="list-item"><div class="thumb" style="color:#ff5a00;background:rgba(255,90,0,.15)">${ICONS.arrow}</div><div style="flex:1"><div style="font-weight:600">${esc(t.name)}</div><div class="quiet" style="font-size:13px">${t.miles} mi &bull; <span class="badge ${t.level}" style="padding:2px 6px;font-size:10px">${t.level}</span></div></div></div></div>`).join("")}</div>`;

function render() {
  if (!S.user && !["home", "signin", "about"].includes(view.name)) view = { name: "home", params: {} };
  const main = $("screen");
  const fn = screens[view.name] || screens.explore;
  main.innerHTML = fn(view.params);
  const showTabs = !NO_TABS.has(view.name);
  main.classList.toggle("no-tabs", !showTabs);
  main.style.padding = view.name === "home" ? "0" : "";
  const tabs = $("tabs");
  tabs.classList.toggle("hidden", !showTabs);
  tabs.innerHTML = TABS.map(([k, l, i]) => `<button class="${TAB_OF[view.name] === k ? "active" : ""}" onclick="history=[];go('${k}',{},false)">${i}<span>${l}</span></button>`).join("");
  if (view.name === "ride" && ride) updateRide();
  if (view.name === "feed") openComments.forEach((id) => $("c-" + id)?.classList.remove("hidden"));
  if (view.name === "chat") { const m = $("msgs"); if (m) main.scrollTop = main.scrollHeight; }
}
function renderKeepFocus(id) { const el = $(id); const pos = el.selectionStart; render(); const n = $(id); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
render();
</script>
</body>
</html>
