const BANK = [
  ...PHRASES.map(([id, , tx]) => [id, tx]),
  ...ROOMS.map(([id, , , ask]) => [`ask-${id}`, ask]),
  ...[R_SLOW, R_RIGHT, R_WAY, R_LUNCH, ...R_ANY, ...CALL_LINES].map((tx) => [null, tx]),
];
const norm = (s) => String(s).toLowerCase().replace(/[\s.,!?¿¡。，！？、“”"'’«»:：;；()（）…\-]/g, "");
function translate(text) {
  const n = norm(text);
  for (const lang of [S.lang, ...L3.filter((l) => l !== S.lang)]) {
    const hit = BANK.find(([, tx]) => norm(tx[ix(lang)]) === n);
    if (hit) return { lang, tx: hit[1], pid: hit[0] };
  }
  return { lang: S.lang, tx: null, pid: null };
}

});

try { const raw = localStorage.getItem(KEY); if (raw) S = { ...fresh(), ...JSON.parse(raw) }; } catch {}

let view = { name: !S.lang ? "language" : S.user || S.guestSince ? "chats" : "welcome", params: {} };
let history = [];

let toastTimer;

const guestDaysLeft = () => (S.guestSince ? Math.max(0, 7 - Math.floor((Date.now() - S.guestSince) / 864e5)) : 0);
const banner = () => (S.guestSince && !S.user ? `<div class="banner"><span>${t("guestBanner", guestDaysLeft())}</span><button class="pill small" onclick="go('join')">${t("join")}</button></div>` : "");
const target = () => (S.lang === "en" ? S.learn : "en");
function avatarHtml(who, big = false) {

}

const screens = {};

screens.join = () => `

function join() { const n = $("name").value.trim(); if (!n) return ($("err").textContent = t("needName")); S.user = n; save(); history = []; go("chats", {}, false); toast(t("hello", n)); }

/* ---- Chats ---- */
const chatName = (c) => (c.kind === "dm" ? c.with : pick(c.name));
function shown(m) {
  if (m.sticker) return { text: m.sticker, note: "" };
  if (m.lang === S.lang) return { text: m.text, note: "" };
  if (m.tx) return { text: m.tx[ix(S.lang)], note: t("translatedFrom", LN[S.lang][m.lang]), canOriginal: true };
  return { text: m.text, note: m.by === "me" ? "" : t("notInDemo") };
}
function streakCheck(c) {
  if (c.kind !== "dm" || !c.lastDay || c.streak === 0) return;
  if (c.lastDay < daysAgo(1)) { c.streak = 0; c.wasReset = true; save(); }
}
screens.chats = () => {
  const list = S.order.map((id) => S.chats[id]).filter((c) => c && !(c.kind === "dm" && S.blocked.includes(c.with)));
  list.forEach(streakCheck);
  const buddy = S.buddy && on("clubs") ? `<div class="card between" style="margin-bottom:12px"><div class="row">${avatarHtml(S.buddy)}<div><div class="quiet small">${t("yourBuddy")}</div><b>${esc(S.buddy)}</b></div></div><button class="pill small" onclick="openDm('${S.buddy}')">${t("message")}</button></div>` : "";
  return `
  <div class="topbar"><h1>${t("tabChats")}</h1><div class="row" style="gap:8px">${on("clubs") ? `<button class="pill small dark" onclick="go('clubs')">${t("clubs")}</button>` : ""}<button class="icon-btn" onclick="go('newgroup')" aria-label="${t("newGroup")}">＋</button></div></div>
  ${banner()}
  ${buddy}
  <div class="stack">${list.map((c) => {
    const last = c.msgs[c.msgs.length - 1];
    const prev = last ? `${c.kind !== "dm" ? `${esc(last.by === "me" ? t("me") : last.by)}: ` : ""}${esc(shown(last).text)}` : "";
    return `<div class="card tap row" onclick="go('chat',{id:'${c.id}'})">${c.kind === "dm" ? avatarHtml(c.with) : `<div class="avatar">${c.kind === "club" ? "⭐" : "👥"}</div>`}<div style="flex:1;min-width:0"><div class="between"><b>${esc(chatName(c))}</b>${c.kind === "dm" && on("streaks") ? `<span class="tag ${c.streak ? "gold" : ""}">🔥 ${t("days", c.streak)}</span>` : c.kind !== "dm" ? `<span class="quiet small">${t("people", c.members.length)}</span>` : ""}</div><div class="quiet" style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">${prev}</div></div></div>`;
  }).join("")}</div>`;
};
function openDm(name) {
  let c = Object.values(S.chats).find((x) => x.kind === "dm" && x.with === name);
  if (!c) { const id = name.toLowerCase(); c = S.chats[id] = { id, kind: "dm", with: name, streak: 0, lastDay: null, msgs: [] }; S.order.unshift(id); save(); }
  go("chat", { id: c.id });
}
let tray = "", reactFor = null, showOrig = {}, menuOpen = false;
screens.chat = ({ id }) => {
  const c = S.chats[id];
  if (!c) return screens.chats();
  streakCheck(c);
  const partnerLang = c.kind === "dm" ? PEOPLE[c.with] : null;
  const msgs = c.msgs.map((m) => {
    const mine = m.by === "me";
    const s = shown(m);
    const orig = showOrig[m.id];
    const text = orig ? m.text : s.text;
    const r = S.reactions[`${id}/${m.id}`];
    const theyRead = mine && !m.sticker && partnerLang && partnerLang !== m.lang ? `<div class="theyread">${t("theyRead", esc(c.with))}${esc(m.tx ? m.tx[ix(partnerLang)] : m.text)}</div>` : mine && !m.sticker && c.kind !== "dm" && m.tx ? `<div class="theyread">${t("everyoneReads")}</div>` : "";
    const noteLine = m.sticker ? "" : mine ? (m.tx ? "" : `<div class="note">${t("notInDemo")}</div>`) : s.canOriginal ? `<div class="note">${orig ? `${esc(LN[S.lang][m.lang])} · ` : `${s.note} · `}<button class="link tiny" onclick="event.stopPropagation();showOrig['${m.id}']=${!orig};render()">${orig ? t("showTranslation") : t("showOriginal")}</button></div>` : s.note ? `<div class="note">${s.note}</div>` : "";
    return `<div class="msg ${mine ? "me" : ""}">${mine ? avatarHtml("me") : avatarHtml(m.by)}<div style="min-width:0">${!mine && c.kind !== "dm" ? `<div class="who">${esc(m.by)}</div>` : ""}<div class="bubble ${m.sticker ? "sticker" : ""}" onclick="reactFor=reactFor==='${m.id}'?null:'${m.id}';render()">${esc(text)}</div>${noteLine}${theyRead}${r && on("stickers") ? `<div class="reacts"><span>${r} 1</span></div>` : ""}${reactFor === m.id ? `<div class="picker">${on("stickers") ? REACTIONS.map((e) => `<button onclick="react('${id}','${m.id}','${e}')">${e}</button>`).join("") : ""}${mine ? `<button class="del" onclick="delMsg('${id}','${m.id}')">${t("delete")}</button>` : ""}</div>` : ""}</div></div>`;
  }).join("");
  const phraseList = tray === "phrases" ? `<div class="phrasebar">${PHRASES.map(([pid, , tx]) => `<button onclick="usePhrase('${pid}')">${esc(pick(tx))}${S.lang !== "en" ? `<div class="quiet small">${esc(tx[0])}</div>` : ""}</button>`).join("")}</div>` : "";
  const stickerTray = tray === "stickers" ? `<div class="tray">${STICKERS.map((s) => `<button onclick="sendSticker('${id}','${s}')">${s}</button>`).join("")}</div>` : "";
  return `
  <div class="topbar"><button class="icon-btn" onclick="tray='';reactFor=null;menuOpen=false;back()" aria-label="${t("back")}">‹</button>
    <div style="flex:1;min-width:0;text-align:center"><h3 style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(chatName(c))}</h3><div class="quiet small">${c.kind === "dm" ? (on("streaks") ? `🔥 ${t("days", c.streak)}` : "") : t("people", c.members.length)}</div></div>
    <div class="row" style="gap:6px">${c.kind === "dm" ? `<button class="icon-btn" onclick="go('call',{id:'${id}'})" aria-label="${t("call")}">📞</button>` : `<button class="icon-btn" onclick="addMember('${id}')" aria-label="${t("addSomeone")}">＋</button>`}<button class="icon-btn" onclick="menuOpen=!menuOpen;render()" aria-label="More">⋯</button></div></div>
  ${menuOpen ? `<div class="menu"><button onclick="menuOpen=false;go('report',{id:'${id}'})">🚩 ${t("report")}</button>${c.kind === "dm" ? `<button class="red" onclick="blockPerson('${id}')">⛔ ${t("block")}</button>` : ""}</div>` : ""}
  ${c.wasReset && on("streaks") ? `<div class="banner"><span>${t("streakReset")}</span></div>` : ""}
  <div class="msgs">${msgs || `<div class="empty">👋</div>`}</div>
  <div class="composer">${on("phrases") ? `<button class="dark" onclick="tray=tray==='phrases'?'':'phrases';render()" aria-label="${t("phrasesTitle")}">🗣️</button>` : ""}${on("stickers") ? `<button class="dark" onclick="tray=tray==='stickers'?'':'stickers';render()" aria-label="Stickers">😊</button>` : ""}<input id="msg" class="field" placeholder="${t("writeIn", LN[S.lang][S.lang])}" value="${esc(S.draft[id] || "")}" oninput="S.draft['${id}']=this.value" onkeydown="if(event.key==='Enter')sendMsg('${id}')"><button onclick="sendMsg('${id}')" aria-label="${t("send")}">➤</button></div>
  ${phraseList}${stickerTray}`;
};
function usePhrase(pid) { const p = PHRASES.find(([x]) => x === pid); S.draft[view.params.id] = pick(p[2]); tray = ""; save(); render(); const el = $("msg"); if (el) el.focus(); }
function bumpStreak(c) {
  if (c.kind !== "dm") return;
  const d = today();
  if (c.lastDay === d) return;
  c.streak = c.lastDay === daysAgo(1) ? c.streak + 1 : 1;
  c.lastDay = d; c.wasReset = false;
  S.longest = Math.max(S.longest, c.streak);
  if (on("streaks")) toast(t("streakUp", c.streak));
}
function sendMsg(id) {
  const text = ($("msg").value || "").trim();
  if (!text) return;
  const c = S.chats[id];
  const tr = translate(text);
  c.msgs.push({ id: mid(), by: "me", lang: tr.lang, text, tx: tr.tx, pid: tr.pid });
  S.draft[id] = ""; tray = "";
  bumpStreak(c); save(); render();
  replySoon(id, replyFor(tr.pid));
}
function sendSticker(id, s) { const c = S.chats[id]; c.msgs.push({ id: mid(), by: "me", sticker: s }); tray = ""; bumpStreak(c); save(); render(); replySoon(id, null, "😂"); }
function replySoon(id, tx, sticker) {
  const c = S.chats[id];
  const who = c.kind === "dm" ? c.with : c.members.find((n) => PEOPLE[n] && PEOPLE[n] !== S.lang) || c.members.find((n) => PEOPLE[n]);
  if (!who || S.blocked.includes(who)) return;
  setTimeout(() => {
    if (!S.chats[id]) return;
    const m = sticker ? { id: mid(), by: who, sticker } : said(who, tx || R_ANY[Math.floor(Math.random() * R_ANY.length)]);
    S.chats[id].msgs.push(m); save();
    if (view.name === "chat" && view.params.id === id) { render(); $("screen").scrollTop = $("screen").scrollHeight; }
  }, 1300);
}
function react(id, m, e) { const k = `${id}/${m}`; if (S.reactions[k] === e) delete S.reactions[k]; else S.reactions[k] = e; reactFor = null; save(); render(); }
function delMsg(id, m) { const c = S.chats[id]; c.msgs = c.msgs.filter((x) => x.id !== m); reactFor = null; save(); render(); toast(t("deleted")); }
function blockPerson(id) {
  const c = S.chats[id]; menuOpen = false;
  if (!confirm(t("blockConfirm", c.with))) return render();
  S.blocked.push(c.with); delete S.chats[id]; S.order = S.order.filter((x) => x !== id);
  if (S.buddy === c.with) S.buddy = null;
  save(); history = []; go("chats", {}, false); toast(t("blocked", c.with));
}
function addMember(id) {
  const c = S.chats[id];
  if (c.members.length >= 30) return toast(t("groupLimit"));
  const who = Object.keys(PEOPLE).find((n) => !c.members.includes(n)) || `Student ${c.members.length + 1}`;
  c.members.push(who); save(); render(); toast(t("added", who));
}

    : `<div class="card"><p class="muted" style="font-size:14px">${S.buddyAsked ? t("buddyWaiting") : t("buddyNone")}</p><div class="row" style="margin-top:12px;justify-content:space-between">${S.buddyAsked ? `<span class="tag gold">${t("buddyWaiting").split(/[.。]/)[0]}</span><button class="link tiny" onclick="matchBuddy()">${t("demoMatch")}</button>` : `<button class="pill small" onclick="S.buddyAsked=true;save();render();toast(t('buddyAsked'))">${t("askBuddy")}</button>`}</div></div>`}
  <h2>${t("clubs")}</h2>
  <div class="stack">${CLUBS.map((cl) => { const joined = S.clubs.includes(cl.id); return `<div class="card between"><div><b>${esc(pick(cl.name))}</b><div class="quiet small">${t("members", cl.count + (joined ? 1 : 0))}</div></div>${joined ? `<button class="pill small dark" onclick="go('chat',{id:'${cl.id}'})">${t("joined")} ›</button>` : `<button class="pill small" onclick="joinClub('${cl.id}')">${t("joinClub")}</button>`}</div>`; }).join("")}</div>`;
function matchBuddy() { S.buddy = BUDDY[S.lang]; S.buddyAsked = false; save(); render(); }
function joinClub(cid) {
  const cl = CLUBS.find((x) => x.id === cid);
  S.clubs.push(cid);
  S.chats[cid] = { id: cid, kind: "club", name: cl.name, members: [cl.by, ...Array.from({ length: cl.count - 1 }, (_, i) => `Member ${i + 1}`), "me"], streak: 0, lastDay: null, msgs: [said(cl.by, cl.hello)] };
  S.order.unshift(cid); save(); go("chat", { id: cid });
}

/* ---- Phrases and practice ---- */
let phraseCat = "class";
screens.phrases = () => `
  <div class="topbar"><h1>${t("tabPhrases")}</h1><button class="pill small" onclick="startPractice()">🧠 ${t("practice")}</button></div>
  ${banner()}
  <p class="muted small">${t("phrasesHelp", LN[S.lang][target()])}</p>
  <div class="chips" style="margin-top:12px">${CATS.map(([k, n]) => `<button class="chip ${phraseCat === k ? "active" : ""}" onclick="phraseCat='${k}';render()">${esc(pick(n))}</button>`).join("")}</div>
  <div class="stack" style="margin-top:12px">${PHRASES.filter(([, c]) => c === phraseCat).map(([pid, , tx]) => `<div class="card between"><div style="min-width:0"><b>${esc(pick(tx))}</b><div class="quiet small" style="margin-top:2px">${esc(tx[ix(target())])}</div></div><button class="icon-btn" onclick="speak(PHRASES.find(p=>p[0]==='${pid}')[2][ix(target())], target())" aria-label="Speak">🔊</button></div>`).join("")}</div>
  ${S.best ? `<p class="quiet small" style="margin-top:14px;text-align:center">${t("best", S.best)}</p>` : ""}`;
let P = null;
function shuffle(a) { return a.map((x) => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map((x) => x[1]); }
function startPractice(cat) {
  const pool = shuffle(PHRASES.filter(([, c]) => !cat || c === cat));
  const qs = shuffle(pool.length >= 5 ? pool : [...pool, ...shuffle(PHRASES.filter(([, c]) => c !== cat))]).slice(0, 5).map(([pid, , tx]) => {
    const wrong = shuffle(PHRASES.filter(([x]) => x !== pid)).slice(0, 3).map(([, , w]) => w[ix(target())]);
    return { ask: pick(tx), answer: tx[ix(target())], options: shuffle([tx[ix(target())], ...wrong]) };
  });
  P = { qs, i: 0, picked: null, right: 0 };
  go("practice");
}
function band(pct) { return BANDS.find(([min]) => pct >= min); }
screens.practice = () => {
  if (!P) return screens.phrases();
  if (P.i >= P.qs.length) {
    const pct = Math.round((P.right / P.qs.length) * 100); const [, letter, words] = band(pct);
    return `<div class="topbar"><button class="icon-btn" onclick="P=null;back()" aria-label="${t("back")}">‹</button><h3>${t("practice")}</h3><span style="width:42px"></span></div>
    <div class="card" style="text-align:center;padding:28px"><div style="font:700 56px var(--display)">${pct}%</div><div class="tag gold" style="margin-top:8px;font-size:14px">${letter} ${esc(pick(words))}</div><p class="muted" style="margin-top:12px">${t("scoreLine", P.right, P.qs.length)}</p></div>
    <div class="stack" style="margin-top:14px"><button class="pill" onclick="startPractice()">${t("again")}</button></div>`;
  }
  const q = P.qs[P.i];
  return `<div class="topbar"><button class="icon-btn" onclick="P=null;back()" aria-label="${t("back")}">‹</button><h3>${t("question", P.i + 1, P.qs.length)}</h3><span style="width:42px"></span></div>
  <p class="muted small">${t("pickFor", LN[S.lang][target()])}</p>
  <div class="card" style="margin-top:8px"><h3>${esc(q.ask)}</h3></div>
  <div class="stack" style="margin-top:12px">${q.options.map((o, i) => { const cls = P.picked === null ? "" : o === q.answer ? "right" : P.picked === i ? "wrong" : ""; return `<button class="qrow ${cls}" onclick="answer(${i})">${esc(o)}</button>`; }).join("")}</div>
  ${P.picked !== null ? `<div style="margin-top:14px"><button class="pill" onclick="P.i++;P.picked=null;render()">${P.i + 1 < P.qs.length ? t("next") : t("finish")}</button></div>` : ""}`;
};
function answer(i) {
  if (P.picked !== null) return;
  P.picked = i;
  const q = P.qs[P.i];
  if (q.options[i] === q.answer) P.right++;
  if (P.i + 1 >= P.qs.length) { S.best = Math.max(S.best, Math.round((P.right / P.qs.length) * 100)); save(); }
  render();
}

/* ---- School guides ---- */
let guideLang = {};
screens.guides = () => `
  <div class="topbar"><h1>${t("tabGuides")}</h1></div>
  ${banner()}
  <p class="muted small">${t("guidesHelp")}</p>
  <div class="stack" style="margin-top:12px">${GUIDES.map((g) => `<div class="card tap row" onclick="go('guide',{id:'${g.id}'})"><div class="avatar">${g.emoji}</div><div style="min-width:0"><b>${esc(pick(g.title))}</b><div class="quiet" style="font-size:14px">${esc(pick(g.summary))}</div></div></div>`).join("")}</div>`;
screens.guide = ({ id }) => {
  const g = GUIDES.find((x) => x.id === id);
  const l = guideLang[id] || S.lang;
  const other = l === S.lang ? (S.lang === "en" ? S.learn : "en") : S.lang;
  return `
  <div class="topbar"><button class="icon-btn" onclick="speechSynthesis&&speechSynthesis.cancel();back()" aria-label="${t("back")}">‹</button><span style="font-size:28px">${g.emoji}</span><span style="width:42px"></span></div>
  <h1 style="font-size:26px">${esc(g.title[ix(l)])}</h1>
  <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="pill small dark" onclick="guideLang['${id}']='${other}';render()">🌐 ${t("readIn", LN[S.lang][other])}</button><button class="pill small dark" onclick="speak(GUIDES.find(x=>x.id==='${id}').body[ix('${l}')], '${l}')">🔊 ${t("readAloud")}</button></div>
  <div class="card" style="margin-top:14px"><p style="font-size:16px;line-height:1.65">${esc(g.body[ix(l)])}</p></div>
  ${on("phrases") ? `<div style="margin-top:14px"><button class="pill" onclick="startPractice('${g.cat}')">🧠 ${t("practiseThese")}</button></div>` : ""}`;
};

/* ---- School map ---- */
let mapRoom = null, mapQ = "";
screens.map = () => {
  const q = norm(mapQ);
  const match = (r) => !q || r[2].some((n) => norm(n).includes(q));
  const hits = ROOMS.filter(match);
  const r = ROOMS.find((x) => x[0] === mapRoom);
  return `
  <div class="topbar"><h1>${t("tabMap")}</h1></div>
  ${banner()}
  <div class="search">🔎<input id="mq" placeholder="${t("mapSearch")}" value="${esc(mapQ)}" oninput="mapQ=this.value;if(ROOMS.filter(x=>x[2].some(n=>norm(n).includes(norm(mapQ)))).length===1)mapRoom=ROOMS.find(x=>x[2].some(n=>norm(n).includes(norm(mapQ))))[0];renderKeepFocus('mq')"></div>
  ${q && !hits.length ? `<p class="quiet small" style="margin-top:8px">${t("noRoom")}</p>` : ""}
  <div class="map" style="margin-top:12px">${ROOMS.map((x) => `<button class="room ${mapRoom === x[0] ? "on" : ""} ${match(x) ? "" : "dim"}" onclick="mapRoom='${x[0]}';render()"><span class="e">${x[1]}</span>${esc(pick(x[2]))}</button>`).join("")}</div>
  ${r ? `<div class="card" style="margin-top:12px"><div class="between"><div><h3>${r[1]} ${esc(pick(r[2]))}</h3>${S.lang !== "en" ? `<div class="muted" style="margin-top:2px">${esc(r[2][0])}</div>` : `<div class="muted" style="margin-top:2px">${esc(r[2][ix(S.learn)])}</div>`}</div><button class="icon-btn" onclick="speak(ROOMS.find(x=>x[0]==='${r[0]}')[2][ix(target())], target())" aria-label="Speak">🔊</button></div>
    <div style="margin-top:12px"><button class="pill" onclick="askWay('${r[0]}')">🧭 ${t("askWay")}</button></div></div>` : `<p class="quiet small" style="margin-top:12px;text-align:center">${t("mapHelp")}</p>`}`;
};
function askWay(rid) {
  const r = ROOMS.find((x) => x[0] === rid);
  const who = S.buddy || "Maya";
  let c = Object.values(S.chats).find((x) => x.kind === "dm" && x.with === who);
  if (!c) { const id = who.toLowerCase(); c = S.chats[id] = { id, kind: "dm", with: who, streak: 0, lastDay: null, msgs: [] }; S.order.unshift(id); }
  S.draft[c.id] = pick(r[3]); save(); go("chat", { id: c.id });
}

/* ---- Me ---- */
screens.me = () => `
  <div class="topbar"><h1>${t("tabMe")}</h1><button class="icon-btn" onclick="go('settings')" aria-label="${t("settings")}">⚙️</button></div>
  ${banner()}
  <div class="card" style="text-align:center;padding:22px"><div style="display:flex;justify-content:center">${avatarHtml("me", true)}</div><h3 style="margin-top:14px">${esc(me())}</h3>${on("streaks") ? `<p class="quiet small" style="margin-top:4px">${t("longest", S.longest)}</p>` : ""}</div>
  <h2>${t("iSpeak")}</h2>
  <div class="chips wrap">${L3.map((l) => `<button class="chip ${S.lang === l ? "active" : ""}" onclick="setLang('${l}')">${LN[l][l]}</button>`).join("")}</div>
  ${S.lang === "en" ? `<h2>${t("iLearn")}</h2><div class="chips wrap">${["zh", "es"].map((l) => `<button class="chip ${S.learn === l ? "active" : ""}" onclick="S.learn='${l}';save();render()">${LN.en[l]}</button>`).join("")}</div>` : ""}
  <div class="stack" style="margin-top:18px">
    ${on("avatar") ? `<button class="pill dark" onclick="go('avatar')">🧑‍🎨 ${S.avatar ? t("changeAvatar") : t("avatar")}</button>` : ""}
    ${on("clubs") ? `<button class="pill dark" onclick="go('clubs')">⭐ ${t("clubs")}</button>` : ""}
    <button class="pill dark" onclick="go('join')">${S.user ? t("joinTitle") : t("join")}</button>
    <button class="pill dark" onclick="go('support')">🛟 ${t("support")}</button>
    <button class="pill dark" onclick="go('about')">ℹ️ ${t("about")}</button>
    <button class="link" style="align-self:center;color:var(--quiet);margin-top:4px" onclick="if(confirm(t('signOutConfirm'))){S=fresh();save();history=[];go('language',{},false)}">${t("signOut")}</button>
  </div>`;
let draftAvatar = null;
screens.avatar = () => {
  const a = draftAvatar || (draftAvatar = S.avatar ? { ...S.avatar } : { face: 0, hair: 0, color: 0, acc: 0 });
  const row = (label, key, opts) => `<label class="lbl">${label}</label><div class="parts">${opts.map((o, i) => `<button class="${a[key] === i ? "on" : ""}" onclick="draftAvatar.${key}=${i};render()">${o || "∅"}</button>`).join("")}</div>`;
  return `
  <div class="topbar"><button class="icon-btn" onclick="draftAvatar=null;back()" aria-label="${t("back")}">‹</button><h3>${t("avatar")}</h3><span style="width:42px"></span></div>
  <div style="display:flex;justify-content:center;margin:10px 0 6px"><div class="avatar big" style="background:${COLORS[a.color]}">${HAIRS[a.hair] ? `<span class="hair">${HAIRS[a.hair]}</span>` : ""}${FACES[a.face]}${ACCS[a.acc] ? `<span class="acc">${ACCS[a.acc]}</span>` : ""}</div></div>
  ${row(t("face"), "face", FACES)}${row(t("hair"), "hair", HAIRS)}
  <label class="lbl">${t("colour")}</label><div class="parts">${COLORS.map((c, i) => `<button class="swatch ${a.color === i ? "on" : ""}" style="background:${c}" onclick="draftAvatar.color=${i};render()" aria-label="${c}"></button>`).join("")}</div>
  ${row(t("extra"), "acc", ACCS)}
  <div style="margin-top:18px"><button class="pill" onclick="S.avatar=draftAvatar;draftAvatar=null;save();back();toast(t('avatarSaved'))">${t("save")}</button></div>`;
};
screens.settings = () => `
  <div class="topbar"><button class="icon-btn" onclick="back()" aria-label="${t("back")}">‹</button><h3>${t("settings")}</h3><span style="width:42px"></span></div>
  <p class="muted" style="font-size:14px">${t("settingsHelp")}</p>
  <div class="stack" style="margin-top:14px">
    <div class="card between"><div><b>${t("tabChats")}</b><div class="quiet small">${t("lockedChats")}</div></div><button class="switch on" disabled></button></div>
    ${FEATURES.map(([k, n]) => `<div class="card between"><b>${esc(pick(n))}</b><button class="switch ${on(k) ? "on" : ""}" onclick="S.off['${k}']=${on(k)};save();render();toast(t('${on(k) ? "turnedOff" : "turnedOn"}', pick(FEATURES.find(f=>f[0]==='${k}')[1])))" aria-label="${esc(pick(n))}"></button></div>`).join("")}
    <div class="card between"><div><b>${t("settings")}</b><div class="quiet small">${t("lockedSettings")}</div></div><button class="switch on" disabled></button></div>
  </div>`;
let faqQ = "";
screens.support = () => {
  const q = faqQ.toLowerCase();
  const list = FAQ.filter(([qq, a]) => !q || pick(qq).toLowerCase().includes(q) || pick(a).toLowerCase().includes(q));
  return `
  <div class="topbar"><button class="icon-btn" onclick="back()" aria-label="${t("back")}">‹</button><h3>${t("support")}</h3><span style="width:42px"></span></div>
  <div class="search">🔎<input id="fq" placeholder="${t("searchHelp")}" value="${esc(faqQ)}" oninput="faqQ=this.value;renderKeepFocus('fq')"></div>
  <div class="stack" style="margin-top:12px">${list.length ? list.map(([qq, a]) => `<div class="card"><b>${esc(pick(qq))}</b><p class="muted" style="font-size:14px;margin-top:4px">${esc(pick(a))}</p></div>`).join("") : `<div class="empty">${t("noMatch")}</div>`}</div>`;
};
screens.about = () => `
  <div class="topbar"><button class="icon-btn" onclick="back()" aria-label="${t("back")}">‹</button><h3>${t("about")}</h3><span style="width:42px"></span></div>
  <div class="stack">${ABOUT.map(([h, b]) => `<div class="card"><h3>${esc(pick(h))}</h3><p class="muted" style="margin-top:6px">${esc(pick(b))}</p></div>`).join("")}</div>`;

/* ---- Tabs and render ---- */
function tabs() { return [["chats", "tabChats", "💬"], ...(on("phrases") ? [["phrases", "tabPhrases", "🗣️"]] : []), ...(on("guides") ? [["guides", "tabGuides", "📘"]] : []), ...(on("map") ? [["map", "tabMap", "🗺️"]] : []), ["me", "tabMe", "🙂"]]; }
const NO_TABS = new Set(["language", "welcome", "join", "call", "chat", "report", "newgroup", "practice", "avatar"]);
const TAB_OF = { chats: "chats", clubs: "chats", phrases: "phrases", guides: "guides", guide: "guides", map: "map", me: "me", settings: "me", support: "me", about: "me" };
const GATE = { phrases: "phrases", practice: "phrases", guides: "guides", guide: "guides", map: "map", clubs: "clubs", avatar: "avatar" };
function render() {
  if (!S.lang && view.name !== "language") view = { name: "language", params: {} };
  else if (S.lang && !S.user && !S.guestSince && !["language", "welcome", "join", "about"].includes(view.name)) view = { name: "welcome", params: {} };
  if (GATE[view.name] && !on(GATE[view.name])) { view = { name: "settings", params: {} }; toast(t("featureOff")); }
  if (view.name === "call" && !callTimer) { callStart = Date.now(); captions = true; callTimer = setInterval(() => { if (view.name === "call") render(); else { clearInterval(callTimer); callTimer = null; } }, 1000); }
  if (view.name !== "call" && callTimer) { clearInterval(callTimer); callTimer = null; }
  if (view.name !== "chat") menuOpen = false;
  document.documentElement.lang = { en: "en", zh: "zh-CN", es: "es" }[S.lang || "en"];
  const main = $("screen");
  main.innerHTML = (screens[view.name] || screens.chats)(view.params);
  const showTabs = !NO_TABS.has(view.name);
  main.classList.toggle("no-tabs", !showTabs);
  main.style.padding = ["language", "welcome", "call"].includes(view.name) ? "0" : "";
  const tb = $("tabs"); tb.classList.toggle("hidden", !showTabs);
  tb.innerHTML = tabs().map(([k, l, i]) => `<button class="${TAB_OF[view.name] === k ? "active" : ""}" onclick="history=[];go('${k}',{},false)"><span class="i">${i}</span><span>${t(l)}</span></button>`).join("");
  if (view.name === "chat") main.scrollTop = main.scrollHeight;
}
function renderKeepFocus(id) { const el = $(id); const pos = el.selectionStart; render(); const n = $(id); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
render();
</script>
</body>
</html>
