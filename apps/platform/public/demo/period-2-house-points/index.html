<style>

    --display: "Sora", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif; --tabs: 72px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e9e5dc; color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; }
  body { min-height: 100dvh; display: flex; justify-content: center; }

  @media (min-width: 700px) { .app { min-height: 100vh; border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
  main { flex: 1; padding: max(16px, env(safe-area-inset-top)) 16px calc(var(--tabs) + 24px); overflow-y: auto; }
  main.no-tabs { padding-bottom: 24px; }
  h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.02em; }
  h1 { font-size: 28px; font-weight: 800; line-height: 1.1; }

  p { margin: 0; line-height: 1.5; }

  .row { display: flex; align-items: center; gap: 10px; } .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; } .stack { display: flex; flex-direction: column; gap: 10px; } .grow { flex: 1; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .pill { font: 700 15px var(--display); color: #fff; background: var(--navy); border: 0; border-radius: 999px; height: 52px; padding: 0 22px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
  .pill:active { background: var(--navy2); }
  .pill.ghost { background: var(--card); color: var(--navy); border: 1px solid var(--line2); }
  .pill.small { height: 36px; font-size: 13px; width: auto; padding: 0 14px; }
  .pill.red { background: var(--red); }
  .link { color: var(--navy); background: none; border: 0; font: 600 14px var(--body); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  .field { width: 100%; background: var(--card); border: 1px solid var(--line2); border-radius: 12px; color: var(--text); font: 16px var(--body); padding: 13px 14px; outline: none; appearance: none; -webkit-appearance: none; }
  .field:focus { border-color: var(--navy); box-shadow: 0 0 0 3px var(--soft); } .field::placeholder { color: var(--quiet); }
  textarea.field { min-height: 84px; resize: vertical; }
  select.field { background-image: linear-gradient(45deg, transparent 50%, var(--quiet) 50%), linear-gradient(135deg, var(--quiet) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
  label.lbl { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
  .error { color: var(--red); font-size: 14px; margin-top: 10px; font-weight: 500; } .error[hidden] { display: none; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; flex: 0 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; margin-bottom: 12px; }
  .tag { font: 700 11px var(--display); text-transform: uppercase; letter-spacing: .06em; padding: 5px 9px; border-radius: 999px; display: inline-block; background: var(--navy); color: #fff; }
  .tag.grey { background: var(--soft); color: var(--muted); }
  .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--tabs) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--card); border-top: 1px solid var(--line); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .tabs.hidden { display: none; }

  .toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabs) + 24px); background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; z-index: 5; }

  .signin { text-align: center; padding: 8px 0 26px; }
  .signin h1 { font-size: 34px; margin-top: 4px; }
  .hint { background: var(--raised); border: 1px dashed var(--line2); border-radius: 14px; padding: 12px 14px; font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 16px; }

  /* Dashboard */
  .houses { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .house { display: grid; grid-template-columns: 34px 1fr auto 20px; grid-template-rows: auto auto; align-items: center; column-gap: 10px; border: 0; border-radius: 18px; padding: 14px 14px 14px 12px; cursor: pointer; text-align: left; font-family: var(--body); width: 100%; }
  .house:active { filter: brightness(.94); }
  .house .rank { grid-row: 1 / span 2; font: 800 15px var(--display); opacity: .75; }
  .house .lbl_house_name { font: 800 20px var(--display); letter-spacing: -0.02em; }
  .house .lbl_recent { grid-column: 2; font-size: 12px; opacity: .8; }
  .house .lbl_all_time { grid-column: 3; grid-row: 1 / span 2; font: 800 30px var(--display); letter-spacing: -0.03em; }
  .house .lnk_open_house { grid-column: 4; grid-row: 1 / span 2; font-size: 22px; opacity: .7; }
  .total-line { margin-top: 4px; }
  .fab { position: absolute; right: 16px; bottom: calc(var(--tabs) + 16px + env(safe-area-inset-bottom)); height: 50px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--navy); color: #fff; font: 700 15px var(--display); box-shadow: 0 10px 24px rgba(24,38,64,.28); cursor: pointer; z-index: 4; }

  /* Events */
  .event { display: flex; gap: 12px; align-items: flex-start; }
  .event .swatch { width: 10px; align-self: stretch; border-radius: 6px; flex: 0 0 auto; min-height: 44px; }
  .event .lbl_event_line { font-size: 15px; } .event .lbl_event_line.removed { color: var(--red); }
  .event .lbl_event_reason { margin-top: 2px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 6px; } .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; font: 600 13px var(--body); color: var(--muted); background: var(--card); border: 1px solid var(--line2); border-radius: 999px; padding: 8px 14px; cursor: pointer; } .chip.active { background: var(--navy); border-color: var(--navy); color: #fff; }

  /* House detail */
  .hero { border-radius: 22px; padding: 18px 16px 16px; position: relative; overflow: hidden; }
  .hero .bear { position: absolute; right: -6px; top: -8px; opacity: .22; transform: rotate(8deg); }
  .hero h1 { font-size: 36px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; border-top: 1px solid rgba(255,255,255,.25); padding-top: 12px; }
  .stats > div { text-align: center; } .stats > div + div { border-left: 1px solid rgba(128,128,128,.25); }
  .stats .v { display: block; font: 800 26px var(--display); letter-spacing: -0.03em; } .stats .k { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .8; margin-top: 2px; }
  .pts { font: 800 22px var(--display); min-width: 34px; text-align: right; }
  .student.me { border-color: var(--navy); }

  /* Settings */
  .switch { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; background: var(--line2); border-radius: 999px; transition: background .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--navy); } .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { box-shadow: 0 0 0 3px var(--soft); }

  /* The point animation: small, in the house colour, with that house's animal.
     Every house at BMS is a bear (Kuma, Gom, Bhalu, Oso, Xiong, Bjorn, Urso and
     Dubb all mean bear), so the animal is a bear and the house is the colour. */
  #anim { position: absolute; left: 16px; right: 16px; top: max(12px, env(safe-area-inset-top)); z-index: 6; pointer-events: none; }
  #anim.show { pointer-events: auto; }
  .pop { display: flex; align-items: center; gap: 14px; border-radius: 20px; padding: 12px 14px; box-shadow: 0 14px 34px rgba(0,0,0,.22); animation: popin .5s cubic-bezier(.2,1.4,.4,1) both; position: relative; overflow: hidden; }
  .pop .bear { animation: bounce .55s ease-in-out .35s 3; transform-origin: 50% 100%; flex: 0 0 auto; }
  .pop .plus { font: 800 30px var(--display); letter-spacing: -0.03em; line-height: 1; }
  .pop .who { font: 600 14px var(--body); opacity: .85; margin-top: 3px; }
  .pop .close { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.14); color: inherit; font-size: 18px; line-height: 1; cursor: pointer; }
  .pop .spark { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: 0; animation: spark .9s ease-out .25s both; }
  .pop .s1 { left: 22%; top: 20%; } .pop .s2 { left: 28%; top: 70%; animation-delay: .4s; } .pop .s3 { left: 60%; top: 15%; animation-delay: .55s; } .pop .s4 { left: 78%; top: 72%; animation-delay: .3s; }
  .pop.leaving { animation: popout .25s ease-in both; }
  @keyframes popin { from { transform: translateY(-24px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes popout { to { transform: translateY(-16px) scale(.9); opacity: 0; } }
  @keyframes bounce { 0%, 100% { transform: translateY(0) scaleY(1); } 40% { transform: translateY(-12px) scaleY(1.06); } 70% { transform: translateY(0) scaleY(.94); } }
  @keyframes spark { 0% { opacity: 0; transform: scale(.2); } 30% { opacity: .9; } 100% { opacity: 0; transform: scale(1.6) translateY(-14px); } }
  @media (prefers-reduced-motion: reduce) { .pop, .pop .bear, .pop .spark { animation-duration: .01s; animation-iteration-count: 1; } }
</style>

<script>
/* ---- The team's tables, exactly as they import them into Anvil ----
   houses.csv, students.csv and point_events.csv from their Table for Anvil
   page. Every name is invented; the totals are the ones that page says to
   check against: Kuma 45, Gom 25, Bhalu 35, Oso 30, Xiong 35, Bjorn 40,
   Urso 40, Dubb 40, and 290 all together. */
const HOUSES = [

  ["Gom", "#E8590C", "#FFFFFF", 2],
  ["Bhalu", "#4CC9F0", "#1C1A19", 3],

  ["Dubb", "#14377D", "#FFFFFF", 8],

const STUDENTS = [

  ["Milo Fenwick", "Gom"], ["Priya Raman", "Gom"], ["Jonah Vance", "Gom"],
  ["Ines Delacroix", "Bhalu"], ["Rowan Petrie", "Bhalu"], ["Kaito Mori", "Bhalu"],
  ["Sofia Marchetti", "Oso"], ["Elias Thorne", "Oso"], ["Amara Boateng", "Oso"],
  ["Ravi Chandra", "Xiong"], ["Lena Hartwell", "Xiong"], ["Otto Lindqvist", "Xiong"],
  ["Mira Solano", "Bjorn"], ["Felix Ashworth", "Bjorn"], ["Zara Haddad", "Bjorn"],
  ["Bruno Cardoso", "Urso"], ["Clara Nystrom", "Urso"], ["Hugo Bellamy", "Urso"],
  ["Talia Winters", "Dubb"], ["Andre Mbeki", "Dubb"], ["Sinead Cavanagh", "Dubb"],

const SEED = [
  ["Kuma", "", 10, "Whole class lined up quietly", "a.harper@example.edu", "2026-09-01 08:15:00"],
  ["Xiong", "Ravi Chandra", 5, "Stayed to help pack away", "a.harper@example.edu", "2026-09-01 10:40:00"],
  ["Bjorn", "", 10, "Best attendance this week", "d.okonkwo@example.edu", "2026-09-01 13:05:00"],
  ["Gom", "Milo Fenwick", 15, "Ran the whole school assembly", "d.okonkwo@example.edu", "2026-09-02 08:15:00"],
  ["Dubb", "", 5, "Tidiest form room", "a.harper@example.edu", "2026-09-02 10:40:00"],

  ["Oso", "Elias Thorne", 20, "Won the maths challenge", "s.vitale@example.edu", "2026-09-03 08:15:00"],
  ["Bhalu", "", 10, "Litter pick at break", "d.okonkwo@example.edu", "2026-09-03 10:40:00"],

  ["Bjorn", "Mira Solano", 15, "Science fair, second place", "s.vitale@example.edu", "2026-09-05 08:15:00"],
  ["Gom", "", -10, "Left the hall in a state", "d.okonkwo@example.edu", "2026-09-05 10:40:00"],
  ["Dubb", "Talia Winters", 10, "Fixed the library shelves", "a.harper@example.edu", "2026-09-05 13:05:00"],

  ["Bjorn", "Zara Haddad", 10, "Organised the food bank collection", "d.okonkwo@example.edu", "2026-09-18 10:40:00"],
];

/* The three invented teachers from the Table for Anvil page. In the real app
   they are rows in Anvil's Users service; here they are the usernames the
   shared password works with. */
const TEACHERS = ["a.harper@example.edu", "d.okonkwo@example.edu", "s.vitale@example.edu"];
const SHARED_PASSWORD = "bruins";
const MAX_PER_GO = 5;
const KEY = "house-points-demo-v1";

/* ---- State ----
   There is no points column anywhere. A total is always the sum of events.
   That is the team's own decision from their data tables page, and the demo
   keeps to it: taking points away is a row with a minus in front. */
function seedEvents() {
  return SEED.map(([house, student, amount, reason, teacher, when], i) => ({ id: `seed-${i}`, house, student, amount, reason, teacher, when: when.replace(" ", "T") }));
}
function fresh() { return { role: null, user: null, animations: true, events: seedEvents() }; }
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = { ...fresh(), ...JSON.parse(raw) }; } catch {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const house = (name) => HOUSES.find((h) => h.name === name);
const sum = (rows) => rows.reduce((a, e) => a + e.amount, 0);
const WEEK = 7 * 24 * 60 * 60 * 1000;
const houseEvents = (name) => S.events.filter((e) => e.house === name);
const houseTotal = (name) => sum(houseEvents(name));
const recentTotal = (name) => sum(houseEvents(name).filter((e) => Date.now() - Date.parse(e.when) < WEEK));
const studentTotal = (h, name) => sum(S.events.filter((e) => e.house === h && e.student === name));
const newestFirst = (rows) => [...rows].sort((a, b) => Date.parse(b.when) - Date.parse(a.when));
/* Sorted by total, highest first, then sort_order, so the first morning of
   eight zeros still comes out in a sensible order. Architecture, Feature 2. */
function ranked() {
  return HOUSES.map((h) => ({ ...h, total: houseTotal(h.name), recent: recentTotal(h.name) })).sort((a, b) => b.total - a.total || a.sort_order - b.sort_order);
}
const teacherName = (email) => email.split("@")[0];
function fmtWhen(iso) {
  const d = new Date(iso); const now = new Date();
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return `Today ${time}`;
  return `${d.getDate()} ${d.toLocaleString([], { month: "short" })}, ${time}`;
}
const signed = (n) => (n < 0 ? `−${-n}` : `+${n}`);

/* ---- Navigation ---- */
/* Reopening the app lands where you were: a student stays a student, a
   teacher stays signed in, the way a real session would. Card 6. */
let view = { name: S.role ? "dashboard" : "signin", params: {} };
let history = [];
function go(name, params = {}, push = true) { if (push) history.push(view); view = { name, params }; render(); $("screen").scrollTop = 0; }
function back() { view = history.pop() || { name: "dashboard", params: {} }; render(); }
let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200); }

/* ---- Icons ---- */
const I = {
  back: "‹",
  houses: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  give: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
};
/* The animal. Every house is a bear, so the bear wears the house's colours. */
function bearSvg(fill, accent, size = 56) {
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true">
    <circle cx="15" cy="19" r="9" fill="${fill}"/><circle cx="49" cy="19" r="9" fill="${fill}"/>
    <circle cx="15" cy="19" r="4" fill="${accent}"/><circle cx="49" cy="19" r="4" fill="${accent}"/>
    <circle cx="32" cy="35" r="22" fill="${fill}"/>
    <ellipse cx="32" cy="43" rx="10" ry="7.5" fill="${accent}" opacity=".92"/>
    <circle cx="24" cy="31" r="3" fill="${accent}"/><circle cx="40" cy="31" r="3" fill="${accent}"/>
    <ellipse cx="32" cy="40.5" rx="4.2" ry="3" fill="${fill}"/>
  </svg>`;
}

/* ---- Sign in ---- */
function signInGuest() { S.role = "student"; S.user = null; save(); history = []; go("dashboard", {}, false); }
function signInTeacher() {
  const username = $("txt_username").value.trim().toLowerCase().replace(/@example\.edu$/, "");
  const password = $("txt_password").value;
  const email = TEACHERS.find((t) => t.split("@")[0] === username);
  if (!email || password !== SHARED_PASSWORD) {
    const el = $("lbl_error"); el.textContent = "That username and password do not match."; el.hidden = false; return;
  }
  S.role = "teacher"; S.user = email; save(); history = []; go("dashboard", {}, false); toast(`Signed in as ${teacherName(email)}`);
}
function signOut() { S.role = null; S.user = null; save(); history = []; go("signin", {}, false); }
function resetAll() { try { localStorage.removeItem(KEY); } catch {} S = fresh(); history = []; go("signin", {}, false); toast("Back to the 36 imported events"); }

/* ---- Giving points ---- */
function studentOptions(houseName, selected) {
  const rows = STUDENTS.filter((s) => s.house === houseName);
  return `<option value="">Whole house</option>${rows.map((s) => `<option value="${esc(s.name)}"${s.name === selected ? " selected" : ""}>${esc(s.name)}</option>`).join("")}`;
}
function onHouseChange() { $("dd_student").innerHTML = studentOptions($("dd_house").value, ""); }
function submitPoints() {
  const houseName = $("dd_house").value, student = $("dd_student").value, direction = $("dd_direction").value;
  const raw = $("txt_amount").value.trim(), n = Number(raw), reason = $("txt_reason").value.trim();
  const err = !houseName ? "Pick a house first."
    : raw === "" || !Number.isInteger(n) ? "Type a whole number of points."
    : n < 1 ? "At least 1 point."
    : n > MAX_PER_GO ? `No more than ${MAX_PER_GO} points in one go. That is the cap from your own story, and it is checked before anything is saved.`
    : !reason ? "Say why. A history full of blank reasons is no history."
    : "";
  const el = $("lbl_error");
  if (err) { el.textContent = err; el.hidden = false; return; }
  el.hidden = true;
  const amount = direction === "remove" ? -n : n;
  S.events.push({ id: `e-${Date.now()}`, house: houseName, student, amount, reason, teacher: S.user, when: new Date().toISOString() });
  save();
  history = []; go("dashboard", {}, false);
  toast(amount > 0 ? `+${amount} to ${student || houseName}. ${houseName} now has ${houseTotal(houseName)}.` : `${-amount} removed from ${student || houseName}. ${houseName} now has ${houseTotal(houseName)}.`);
  if (amount > 0) playAnimation(houseName, amount, student);
}

/* ---- The animation ---- */
let animTimer;
function playAnimation(houseName, amount, student) {
  if (!S.animations) return;
  const h = house(houseName);
  const el = $("anim");
  el.innerHTML = `<div class="pop" data-house="${esc(h.name)}" style="background:${h.colour};color:${h.text_on}">
    <button class="close" aria-label="Close" onclick="closeAnimation()">×</button>
    <div class="bear">${bearSvg(h.text_on, h.colour)}</div>
    <div><div class="plus">+${amount}</div><div class="who">${esc(h.name)}${student ? ` · ${esc(student)}` : ""}</div></div>
    <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span>
  </div>`;
  el.classList.add("show");
  clearTimeout(animTimer); animTimer = setTimeout(closeAnimation, 3400);
}
function closeAnimation() {
  const el = $("anim"); const pop = el.querySelector(".pop");
  clearTimeout(animTimer);
  if (!pop) return;
  pop.classList.add("leaving");
  el.classList.remove("show");
  setTimeout(() => { if (el.querySelector(".pop") === pop) el.innerHTML = ""; }, 260);
}
function toggleAnimations(on) { S.animations = on; save(); toast(on ? "Animations on" : "Animations off"); }

/* ---- Screens ---- */
const screens = {};

screens.signin = () => `
  <div class="signin">
    <div class="crest">${bearSvg("#ffffff", "#182640", 64)}</div>
    <p class="eyebrow">BMS houses</p>
    <h1>House Point Tracker</h1>
    <p class="muted" style="margin-top:10px">Every house, every point, added up live. Students look. Teachers give.</p>
  </div>
  <div class="stack">
    <button class="pill" id="btn_teacher_sign_in" onclick="go('teacher')">I am a teacher</button>
    <button class="pill ghost" id="btn_guest" onclick="signInGuest()">Continue as a student</button>
  </div>
  <p class="quiet small" style="text-align:center;margin-top:16px">Students need no account. Teachers sign in with their own username and the shared password. <button class="link" onclick="go('about')">About this demo</button></p>`;

screens.teacher = () => `
  <div class="topbar"><button class="icon-btn" onclick="back()" aria-label="Back">${I.back}</button><h3>Teacher sign in</h3></div>
  <label class="lbl" for="txt_username">Your username</label>
  <input id="txt_username" class="field" placeholder="a.harper" autocapitalize="none" autocomplete="username">
  <label class="lbl" for="txt_password">Shared password</label>
  <input id="txt_password" class="field" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')signInTeacher()">
  <p id="lbl_error" class="error" hidden></p>
  <button class="pill" id="btn_sign_in" style="margin-top:18px" onclick="signInTeacher()">Sign in</button>
  <div class="hint">For this demo the teachers are <b>a.harper</b>, <b>d.okonkwo</b> and <b>s.vitale</b>, and the shared password is <b>bruins</b>. They are invented, from the team's own import tables. Whichever one you pick is the name that lands in the history.</div>`;

screens.dashboard = () => {
  const rows = ranked();
  const total = rows.reduce((a, h) => a + h.total, 0);
  const latest = newestFirst(S.events).slice(0, 3);
  return `
  <div class="topbar"><div><p class="eyebrow">BMS houses</p><h1>House points</h1></div>${S.role === "teacher" ? `<span class="tag">Teacher</span>` : `<span class="tag grey">Student</span>`}</div>
  <p class="muted total-line">All time, every house. <b id="lbl_grand_total">${total}</b> points on the board.</p>
  <div class="houses" id="rp_houses">
    ${rows.map((h, i) => `<button class="house" data-house="${esc(h.name)}" style="background:${h.colour};color:${h.text_on}" onclick="go('house',{house:'${h.name}'})" aria-label="${esc(h.name)}, ${h.total} points, open">
      <span class="rank">${i + 1}</span>
      <span class="lbl_house_name">${esc(h.name)}</span>
      <span class="lbl_recent">${signed(h.recent)} this week</span>
      <span class="lbl_all_time">${h.total}</span>
      <span class="lnk_open_house" aria-hidden="true">›</span>
    </button>`).join("")}
  </div>
  <h2>Latest changes</h2>
  <div class="stack" id="latest">${latest.map(eventCard).join("")}</div>
  <button class="pill ghost" id="btn_history" style="margin-top:12px" onclick="go('history')">See the whole history</button>
  ${S.role === "teacher" ? `<button class="fab" id="btn_give_points" onclick="go('give')">+ Give points</button>` : ""}`;
};

function eventCard(e) {
  const h = house(e.house); const removed = e.amount < 0;
  const line = removed ? `${-e.amount} removed from ${e.house}` : `+${e.amount} ${e.house}`;
  return `<div class="card event" data-id="${esc(e.id)}"><span class="swatch" style="background:${h.colour}"></span><div class="grow">
    <div class="between"><b class="lbl_event_line${removed ? " removed" : ""}">${esc(line)}${e.student ? ` · ${esc(e.student)}` : ""}</b><span class="quiet small">${fmtWhen(e.when)}</span></div>
    <p class="muted lbl_event_reason">${esc(e.reason)}</p>
    <p class="quiet small lbl_event_teacher">by ${esc(teacherName(e.teacher))}</p>
  </div></div>`;
}

screens.house = ({ house: name }) => {
  const h = house(name);
  if (!h) return screens.dashboard();
  const rank = ranked().findIndex((r) => r.name === name) + 1;
  const total = houseTotal(name), recent = recentTotal(name);
  const members = STUDENTS.filter((s) => s.house === name).map((s) => ({ ...s, total: studentTotal(name, s.name), count: S.events.filter((e) => e.house === name && e.student === s.name).length })).sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
  const whole = sum(houseEvents(name).filter((e) => !e.student));
  const recentEvents = newestFirst(houseEvents(name)).slice(0, 8);
  return `
  <div class="topbar"><button class="icon-btn" id="btn_back" onclick="back()" aria-label="Back">${I.back}</button><h3>House</h3></div>
  <div class="hero" style="background:${h.colour};color:${h.text_on}">
    <div class="bear">${bearSvg(h.text_on, h.colour, 120)}</div>
    <p class="eyebrow" style="color:inherit;opacity:.8">Rank ${rank} of ${HOUSES.length}</p>
    <h1 id="lbl_house_name">${esc(h.name)}</h1>
    <div class="stats">
      <div><span class="v" id="lbl_house_total">${total}</span><span class="k">All time</span></div>
      <div><span class="v" id="lbl_house_recent">${signed(recent)}</span><span class="k">This week</span></div>
      <div><span class="v">${members.length}</span><span class="k">Students</span></div>
    </div>
  </div>
  <h2>Students, highest first</h2>
  <div class="stack" id="rp_students">
    ${members.map((s) => `<div class="card between student" data-student="${esc(s.name)}"><div><b class="lbl_student_name">${esc(s.name)}</b><p class="quiet small">${s.count === 0 ? "Nothing yet" : s.count === 1 ? "1 change" : `${s.count} changes`}</p></div>
      <div class="row"><span class="pts lbl_student_points">${s.total}</span>${S.role === "teacher" ? `<button class="pill small" onclick="go('give',{house:'${h.name}',student:'${esc(s.name)}'})">Give</button>` : ""}</div></div>`).join("")}
    <div class="card between"><div><b>Whole house</b><p class="quiet small">Assemblies, tidy rooms, everyone in on time.</p></div><div class="row"><span class="pts" id="lbl_whole_house">${whole}</span>${S.role === "teacher" ? `<button class="pill small" onclick="go('give',{house:'${h.name}'})">Give</button>` : ""}</div></div>
  </div>
  ${S.role === "teacher" ? "" : `<p class="quiet small" style="margin-top:10px">Find your own name. That number is yours, and the house total is everybody's added together.</p>`}
  <h2>Recent for ${esc(h.name)}</h2>
  <div class="stack">${recentEvents.length ? recentEvents.map(eventCard).join("") : `<p class="muted">Nothing yet.</p>`}</div>`;
};

screens.give = ({ house: pre = "", student: preStudent = "" } = {}) => `
  <div class="topbar"><button class="icon-btn" onclick="back()" aria-label="Back">${I.back}</button><h3>Give points</h3></div>
  <p class="muted">To one student, or to a whole house. Up to ${MAX_PER_GO} in one go, and a reason every time.</p>
  <label class="lbl" for="dd_house">House</label>
  <select id="dd_house" class="field" onchange="onHouseChange()"><option value="">Pick a house</option>${HOUSES.map((h) => `<option value="${esc(h.name)}"${h.name === pre ? " selected" : ""}>${esc(h.name)}</option>`).join("")}</select>
  <label class="lbl" for="dd_student">Student</label>
  <select id="dd_student" class="field">${pre ? studentOptions(pre, preStudent) : `<option value="">Whole house</option>`}</select>
  <label class="lbl" for="dd_direction">Award or take away</label>
  <select id="dd_direction" class="field"><option value="award">Award</option><option value="remove">Take away</option></select>
  <label class="lbl" for="txt_amount">How many (1 to ${MAX_PER_GO})</label>
  <input id="txt_amount" class="field" type="number" inputmode="numeric" min="1" max="${MAX_PER_GO}" step="1" placeholder="5">
  <label class="lbl" for="txt_reason">Reason</label>
  <textarea id="txt_reason" class="field" placeholder="What did they do?"></textarea>
  <p id="lbl_error" class="error" hidden></p>
  <button class="pill" id="btn_submit" style="margin-top:18px" onclick="submitPoints()">Save</button>
  <p class="quiet small" style="text-align:center;margin-top:12px">Recorded as <b>${esc(teacherName(S.user || ""))}</b>. That comes from your sign in, not from a box.</p>`;

screens.history = ({ house: filter = "" } = {}) => {
  const rows = newestFirst(filter ? houseEvents(filter) : S.events);
  return `
  <div class="topbar"><div><p class="eyebrow">Every change, newest first</p><h1>History</h1></div></div>
  <p class="muted">${rows.length} ${rows.length === 1 ? "change" : "changes"}${filter ? ` for ${esc(filter)}` : ""}. Nothing in here is ever edited or deleted. A mistake is fixed with a second row.</p>
  <div class="chips" style="margin-top:12px">
    <button class="chip${filter ? "" : " active"}" onclick="go('history',{},false)">All</button>
    ${HOUSES.map((h) => `<button class="chip${filter === h.name ? " active" : ""}" onclick="go('history',{house:'${h.name}'},false)">${esc(h.name)}</button>`).join("")}
  </div>
  <div class="stack" id="rp_events" style="margin-top:8px">${rows.map(eventCard).join("")}</div>`;
};

screens.settings = () => `
  <div class="topbar"><div><p class="eyebrow">You</p><h1>Settings</h1></div></div>
  <div class="stack">
    ${S.role === "teacher"
      ? `<div class="card between"><div><b>Signed in as a teacher</b><p class="muted small">${esc(S.user)}</p></div><button class="pill small ghost" id="btn_sign_out" onclick="signOut()">Sign out</button></div>`
      : `<div class="card between"><div><b>Student</b><p class="muted small">No account, no password. You can look, not give.</p></div><button class="pill small" onclick="go('teacher')">Teacher sign in</button></div>`}
    <div class="card between"><div><b>Point animations</b><p class="muted small">A small bear in the house colour whenever points are given. Close it, or turn it off here.</p></div>
      <label class="switch"><input type="checkbox" id="chk_animations" ${S.animations ? "checked" : ""} onchange="toggleAnimations(this.checked)"><span></span></label></div>
    <button class="pill ghost" id="btn_sample_animation" onclick="playAnimation(HOUSES[Math.floor(Math.random()*HOUSES.length)].name, 5, '')">Play one now</button>
    <button class="pill ghost" onclick="go('about')">About this demo</button>
    <button class="link" style="align-self:center;color:var(--quiet);margin-top:8px" id="btn_reset" onclick="resetAll()">Reset the demo data</button>
  </div>`;

screens.about = () => `
  <div class="topbar"><button class="icon-btn" onclick="back()" aria-label="Back">${I.back}</button><h3>About this demo</h3></div>
  <div class="stack">
    <div class="card"><h3 style="font-size:16px">Where this came from</h3><p class="muted" style="margin-top:6px">The House Points team's product plan, their eight user stories, their build cards and their architecture page. Every screen is one of the five frames their architecture names, and every button and label on it uses the team's own component names. Nothing here does something they did not ask for.</p></div>
    <div class="card"><h3 style="font-size:16px">What is real</h3><p class="muted" style="margin-top:6px">The eight houses and their colours, the 24 students and the 36 point events are the team's own import tables from their Table for Anvil page, invented names and all. The totals start where that page says they should: Kuma 45, and 290 all together. The three teachers are invented too, and the shared password is only for this demo.</p></div>
    <div class="card"><h3 style="font-size:16px">Where your stuff goes</h3><p class="muted" style="margin-top:6px">This browser only. Points survive closing and reopening the tab, but another phone opening the link starts from the 36 imported events. In the real app that is Anvil's data tables doing the storing, which is the team's cloud storage story, and it is why a second browser sees the same board.</p></div>
    <div class="card"><h3 style="font-size:16px">The one rule</h3><p class="muted" style="margin-top:6px">No house has a total stored anywhere. Every number on the board is the sum of that house's rows in the history, and taking points away is a row with a minus in front. Add ten, remove ten, and the total lands back where it started. That is the team's own design decision, and it is the best idea in the app.</p></div>
    <div class="card"><h3 style="font-size:16px">Still yours to settle</h3><p class="muted" style="margin-top:6px">The cap here is the one from your newest story: no more than five points in one go. Your earlier story also capped a teacher per day; if you meant both, say so in the story studio. And "most recent" is shown both ways, a this week figure on every house and the last three changes underneath. Pick one.</p></div>
  </div>`;

/* ---- Tabs and render ---- */
const TAB_OF = { dashboard: "dashboard", house: "dashboard", history: "history", give: "give", settings: "settings", about: "settings" };
const NO_TABS = new Set(["signin", "teacher"]);
function render() {
  if (!S.role && !NO_TABS.has(view.name) && view.name !== "about") view = { name: "signin", params: {} };
  if (view.name === "give" && S.role !== "teacher") { view = { name: "teacher", params: {} }; toast("Teachers sign in to give points"); }
  const main = $("screen");
  main.innerHTML = (screens[view.name] || screens.dashboard)(view.params);
  const showTabs = !NO_TABS.has(view.name) && !!S.role;
  main.classList.toggle("no-tabs", !showTabs);
  const tabs = $("tabs");
  tabs.classList.toggle("hidden", !showTabs);
  const list = [["dashboard", "Houses", I.houses], ["history", "History", I.history], ...(S.role === "teacher" ? [["give", "Give", I.give]] : []), ["settings", "Settings", I.settings]];
  tabs.innerHTML = list.map(([k, l, i]) => `<button class="${TAB_OF[view.name] === k ? "active" : ""}" data-tab="${k}" onclick="history=[];go('${k}',{},false)">${i}<span>${l}</span></button>`).join("");
}
render();
</script>
</body>
</html>
