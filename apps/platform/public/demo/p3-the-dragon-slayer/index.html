<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f24">
<title>W.C.O 27</title>
<meta name="description" content="A working demo of World Cup Obby G.O.A.T. Edition (W.C.O 27), built from the three user stories the dragon slayer team wrote on Launch Pad. Turn on X-ray to see what they wrote and what was built from it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  W.C.O 27: a hand-built demo of what the dragon slayer (period 3) planned on
  Launch Pad. Their three stories chain into one loop: play the obby, get
  cards, build a dream team, take it to the tournament. Every story is quoted
  word for word in X-ray mode next to what was built from it.
  Every player and club is made up: no real names, likenesses or brands.
  No em dashes in any copy here.
-->
<style>
  :root {
    --bg: #0a0f24; --bg2: #111836; --card: #161f43; --line: #26305c; --line2: #36427a; --text: #eef1ff; --muted: #a3abd6; --quiet: #6f78a8;
    --green: #39ff88; --green2: #12c763; --gold: #ffd23f; --pink: #ff4d8d; --cyan: #3de0ff; --purple: #a86bff; --red: #ff5a4d;
    --xray: #00e0f0; --display: "Bungee", "Sora", system-ui, sans-serif; --head: "Sora", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif; --tabs: 70px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #05081a; color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; }
  body { min-height: 100dvh; display: flex; justify-content: center; }
  .app { position: relative; width: 100%; max-width: 430px; height: 100dvh; background: radial-gradient(120% 60% at 50% -10%, #23307a 0%, var(--bg) 55%); display: flex; flex-direction: column; overflow: hidden; }
  @media (min-width: 700px) { body { padding: 24px 0; } .app { min-height: 860px; height: 860px; border-radius: 36px; border: 10px solid #000; box-shadow: 0 30px 80px rgba(61,224,255,.18), 0 0 0 1px #222; } }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: max(14px, env(safe-area-inset-top)) 14px 10px; }
  .brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; text-align: left; min-width: 0; }
  .logo { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--green), var(--cyan)); display: grid; place-items: center; flex: none; box-shadow: 0 0 18px rgba(57,255,136,.45); }
  .brand b { font: 400 18px var(--display); display: block; letter-spacing: .02em; line-height: 1.05; }
  .brand span span { font-size: 11px; color: var(--muted); }
  .xbtn { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22); color: #fff; border-radius: 999px; padding: 7px 12px; font: 700 12px var(--head); cursor: pointer; letter-spacing: .04em; white-space: nowrap; flex: none; }
  .xbtn i { width: 30px; height: 18px; border-radius: 9px; background: rgba(255,255,255,.25); position: relative; }
  .xbtn i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .2s; }
  body.xray .xbtn { background: var(--xray); border-color: var(--xray); color: #00262a; }
  body.xray .xbtn i::after { left: 14px; }
  main { flex: 1; overflow-y: auto; padding: 4px 14px calc(var(--tabs) + 20px); }
  h1, h2, h3 { margin: 0; }
  h1 { font: 400 24px var(--display); letter-spacing: .01em; }
  h2 { font: 700 11px var(--head); text-transform: uppercase; letter-spacing: .14em; color: var(--quiet); margin: 18px 0 8px; }
  h3 { font: 700 16px var(--head); }
  p { margin: 0; line-height: 1.45; }
  .muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 11px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
  .row { display: flex; align-items: center; gap: 10px; } .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .stack > * + * { margin-top: 10px; }
  .pill { font: 800 15px var(--head); color: #04210f; background: linear-gradient(180deg, var(--green), var(--green2)); border: 0; border-radius: 999px; height: 50px; padding: 0 20px; width: 100%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 20px rgba(57,255,136,.25); text-decoration: none; }
  .pill:active { transform: translateY(1px); }
  .pill.ghost { background: transparent; color: var(--text); border: 1px solid var(--line2); box-shadow: none; }
  .pill.gold { background: linear-gradient(180deg, #ffe680, var(--gold)); color: #3a2a00; box-shadow: 0 6px 20px rgba(255,210,63,.3); }
  .pill.small { height: 34px; width: auto; font-size: 12px; padding: 0 12px; }
  .pill:disabled { opacity: .45; cursor: not-allowed; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 11px; font: 600 12px var(--body); background: rgba(255,255,255,.07); color: var(--text); border: 1px solid var(--line); cursor: pointer; }
  .chip.on { background: var(--green); color: #04210f; border-color: var(--green); }
  .field { width: 100%; background: var(--bg2); border: 1px solid var(--line2); border-radius: 12px; font: 16px var(--body); padding: 11px 12px; color: var(--text); outline: none; }
  .field:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(57,255,136,.18); }
  label.lbl { display: block; font: 600 12px var(--body); color: var(--muted); margin-bottom: 4px; }

  nav.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tabs); background: rgba(10,15,36,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 11px var(--body); color: var(--quiet); cursor: pointer; position: relative; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--green); }
  nav.tabs .badge { position: absolute; top: 8px; right: calc(50% - 20px); background: var(--pink); color: #fff; font: 700 10px var(--head); border-radius: 999px; padding: 1px 6px; }

  /* obby */
  .stage { position: relative; border-radius: 20px; overflow: hidden; border: 1px solid var(--line2); box-shadow: 0 10px 30px rgba(0,0,0,.4); touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas#game { display: block; width: 100%; height: auto; background: #0b1230; }
  .hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
  .stat b { display: block; font: 400 18px var(--display); color: var(--gold); }
  .stat span { font-size: 11px; color: var(--muted); }
  .how { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .how span { font-size: 12px; color: var(--muted); background: rgba(255,255,255,.05); border-radius: 999px; padding: 5px 10px; }

  /* cards */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pc { position: relative; aspect-ratio: 5/7; border-radius: 12px; padding: 7px; color: #10131f; cursor: pointer; overflow: hidden; border: 0; text-align: left; font-family: var(--body); display: flex; flex-direction: column; }
  .pc.locked { background: rgba(255,255,255,.04) !important; border: 1px dashed var(--line2); color: var(--quiet); cursor: default; }
  .pc .ovr { font: 400 20px var(--display); line-height: 1; }
  .pc .pos { font: 800 10px var(--head); letter-spacing: .06em; }
  .pc .face { flex: 1; display: grid; place-items: center; }
  .pc .shirt { width: 54%; aspect-ratio: 1; border-radius: 30% 30% 20% 20%; display: grid; place-items: center; font: 800 13px var(--head); color: #fff; box-shadow: inset 0 -6px 0 rgba(0,0,0,.18); }
  .pc .nm { font: 800 10.5px var(--head); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .pc .cnt { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.55); color: #fff; font: 700 10px var(--head); border-radius: 999px; padding: 1px 6px; }
  .r-Common { background: linear-gradient(160deg, #e9edf3, #b9c2cf); }
  .r-Rare { background: linear-gradient(160deg, #9fe7ff, #3a8cff); }
  .r-Legend { background: linear-gradient(160deg, #ffe58a, #e6a400); box-shadow: 0 0 16px rgba(255,210,63,.45); }
  .r-GOAT { background: linear-gradient(160deg, #ff9fe0, #a86bff 55%, #3de0ff); box-shadow: 0 0 22px rgba(168,107,255,.7); }
  .r-GOAT::after, .r-Legend::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 45%, transparent 60%); background-size: 250% 100%; animation: shine 2.6s linear infinite; pointer-events: none; }
  @keyframes shine { from { background-position: 150% 0; } to { background-position: -100% 0; } }
  .rtag { display: inline-block; font: 800 10px var(--head); letter-spacing: .08em; border-radius: 6px; padding: 2px 7px; }
  .bars > div { display: grid; grid-template-columns: 42px 1fr 28px; gap: 8px; align-items: center; font-size: 12px; margin-top: 6px; }
  .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--green), var(--cyan)); }
  .progress { height: 10px; border-radius: 5px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 6px; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--gold)); }

  /* team */
  .pitch { position: relative; aspect-ratio: 4/5.7; border-radius: 20px; background: repeating-linear-gradient(0deg, #137a3f 0 36px, #11703a 36px 72px); border: 2px solid rgba(255,255,255,.35); overflow: hidden; }
  .pitch::before { content: ""; position: absolute; left: 50%; top: -14%; width: 44%; aspect-ratio: 1; transform: translateX(-50%); border: 2px solid rgba(255,255,255,.35); border-radius: 50%; }
  .pitch::after { content: ""; position: absolute; left: 25%; right: 25%; bottom: 0; height: 16%; border: 2px solid rgba(255,255,255,.35); border-bottom: 0; }
  .slot { position: absolute; width: 23%; transform: translate(-50%, -50%); background: none; border: 0; padding: 0; cursor: pointer; }
  .slot .pc { width: 100%; pointer-events: none; }
  .slot .empty { aspect-ratio: 5/7; border-radius: 12px; border: 2px dashed rgba(255,255,255,.6); display: grid; place-items: center; color: #fff; font: 800 13px var(--head); background: rgba(0,0,0,.18); }
  .rating { display: flex; align-items: center; gap: 14px; }
  .rating .num { font: 400 46px var(--display); color: var(--gold); line-height: 1; text-shadow: 0 0 18px rgba(255,210,63,.45); }
  .pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }

  /* tournament */
  .bracket { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-items: center; }
  .round h4 { margin: 0 0 6px; font: 700 10px var(--head); letter-spacing: .12em; text-transform: uppercase; color: var(--quiet); text-align: center; }
  .tie { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  .tie div { display: flex; justify-content: space-between; gap: 4px; padding: 5px 7px; font-size: 11px; white-space: nowrap; }
  .tie div + div { border-top: 1px solid var(--line); }
  .tie .me { color: var(--green); font-weight: 700; }
  .tie .out { opacity: .4; text-decoration: line-through; }
  .tie .sc { font-weight: 800; font-family: var(--head); }
  .match { text-align: center; padding: 18px 14px; background: linear-gradient(180deg, #1b2657, #121a3c); border: 1px solid var(--line2); border-radius: 20px; }
  .match .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 8px; }
  .match .club { font: 700 13px var(--head); }
  .match .score { font: 400 40px var(--display); letter-spacing: .04em; }
  .match .clock { font: 700 12px var(--head); color: var(--green); }
  .events { margin-top: 10px; min-height: 44px; font-size: 13px; color: var(--muted); }
  .events div { animation: pop .3s ease-out; }
  .crest { width: 34px; height: 38px; margin: 0 auto 4px; border-radius: 8px 8px 50% 50%; display: grid; place-items: center; font: 800 11px var(--head); color: #fff; }

  /* your turn */
  .sent { background: rgba(57,255,136,.09); border: 1px solid rgba(57,255,136,.25); border-radius: 14px; padding: 12px; font-style: italic; color: #c9ffe0; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 4px 0; }
  .check b { width: 18px; flex: none; text-align: center; }
  .need { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px dashed var(--line2); font-size: 14px; }
  .need:last-child { border-bottom: 0; }
  .need .ic { font-size: 18px; line-height: 1.2; }
  .need small { display: block; font: 700 10px var(--head); letter-spacing: .1em; text-transform: uppercase; color: var(--quiet); }

  /* x-ray */
  .x { display: none; margin-top: 12px; border: 2px dashed var(--xray); border-radius: 16px; background: rgba(0,224,240,.07); padding: 12px; font-size: 13px; }
  body.xray .x { display: block; animation: pop .25s ease-out; }
  body.xray .xo { outline: 2px dashed var(--xray); outline-offset: 3px; border-radius: 20px; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
  .x .k { font: 800 10px var(--head); letter-spacing: .14em; text-transform: uppercase; color: var(--xray); margin-bottom: 4px; }
  .x blockquote { margin: 0 0 10px; padding: 8px 10px; background: rgba(255,255,255,.06); border-radius: 10px; border-left: 4px solid var(--green); font-style: italic; color: #d8ffe9; }
  .x ul { margin: 0; padding: 0; list-style: none; }
  .x li { padding: 4px 0; display: grid; grid-template-columns: 62px 1fr; gap: 6px; }
  .x .tag { font: 700 9px var(--head); letter-spacing: .08em; text-transform: uppercase; border-radius: 6px; padding: 3px 0; text-align: center; height: fit-content; }
  .tag.data { background: #12365a; color: #8fd3ff; } .tag.logic { background: #33205e; color: #d2b6ff; } .tag.fake { background: #4a3a0a; color: #ffd86b; } .tag.added { background: #561e22; color: #ff9d95; } .tag.ask { background: #10452b; color: #8dffbe; }

  /* sheet */
  .sheet { position: absolute; inset: 0; background: rgba(2,4,14,.7); z-index: 20; display: none; align-items: flex-end; }
  .sheet.open { display: flex; }
  .sheet .panel { background: var(--bg2); border-top: 1px solid var(--line2); width: 100%; max-height: 92%; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 18px 16px 28px; animation: up .25s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  .flow { position: relative; padding-left: 18px; border-left: 3px solid var(--line2); margin-left: 6px; }
  .flow > div { position: relative; margin-bottom: 14px; }
  .flow > div::before { content: ""; position: absolute; left: -26px; top: 4px; width: 13px; height: 13px; border-radius: 50%; background: var(--green); border: 3px solid var(--bg2); }
  .arrow { color: var(--quiet); font-size: 12px; margin: 4px 0; }
  .toast { position: absolute; left: 16px; right: 16px; bottom: calc(var(--tabs) + 12px); background: #fff; color: #0a0f24; padding: 12px 14px; border-radius: 14px; font-size: 13px; font-weight: 600; z-index: 15; opacity: 0; transform: translateY(8px); transition: .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }

  /* pack opening */
  .pack { position: absolute; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: radial-gradient(circle at 50% 40%, rgba(57,255,136,.25), rgba(2,4,14,.94) 60%); padding: 20px; }
  .pack.open { display: flex; }
  .pack .title { font: 400 26px var(--display); text-align: center; text-shadow: 0 0 20px rgba(57,255,136,.6); }
  .pack .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 360px; }
  .flip { perspective: 800px; aspect-ratio: 5/7; cursor: pointer; }
  .flip .in { position: relative; width: 100%; height: 100%; transition: transform .7s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
  .flip.done .in { transform: rotateY(180deg); }
  .flip .back, .flip .front { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; }
  .flip .back { background: linear-gradient(135deg, #1b2a6b, #0b1230); border: 2px solid var(--green); display: grid; place-items: center; font: 400 22px var(--display); color: var(--green); box-shadow: 0 0 22px rgba(57,255,136,.35); }
  .flip .front { transform: rotateY(180deg); }
  .flip .front .pc { width: 100%; height: 100%; }
  .burst { animation: burst .9s ease-out; }
  @keyframes burst { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  .confetti { position: absolute; width: 8px; height: 12px; top: -20px; animation: fall linear forwards; z-index: 31; pointer-events: none; }
  @keyframes fall { to { transform: translateY(900px) rotate(720deg); } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" id="brand" aria-label="How this app was made">
      <span class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#04210f" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z" fill="#04210f"/><path d="M12 3v4M16 10l4.5-1.5M14.5 14.5L17 19M9.5 14.5L7 19M8 10L3.5 8.5"/></svg></span>
      <span><b>W.C.O 27</b><span>by the dragon slayer &middot; how it was made &rsaquo;</span></span>
    </button>
    <button class="xbtn" id="xray" aria-pressed="false" title="See what the team wrote and what was built from it">X-RAY <i></i></button>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
  <div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
  <div class="pack" id="pack"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
"use strict";
/* ================================================================== the team's words
   Copied from docs/launch/p3-the-dragon-slayer, which is what they wrote on Launch Pad. */
const TEAM = {
  name: "the dragon slayer", period: 3,
  product: "World Cup Obby G.O.A.T. Edition (W.C.O 27)",
  idea: "An obby game and soccer combined.",
  purpose: "It will make people like soccer more.",
  users: [["Anyone", "It makes them happy."], ["Anyone", "It makes them happy."]],
  stories: [
    { id: 1, feature: "Collect soccer cards", text: "As a player, I want to collect soccer cards, so that I can use them in my dream team." },
    { id: 2, feature: "Use my team", text: "As a player, I want to use my team, so that I can play in the online tournament." },
    { id: 3, feature: "Play the obby", text: "As a player, I want to play the obby, so that I can get cards." },
  ],
};

/* ================================================================== made-up world
   Every player and club below is invented. A seeded random generator makes the
   same 48 cards every time, so a card a student pulls today exists tomorrow. */
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const CLUBS = [
  { name: "Riverbend Rockets", short: "RBR", color: "#e5484d" },
  { name: "Blue Ridge Bears", short: "BRB", color: "#3a7bff" },
  { name: "Thunder Valley FC", short: "TVF", color: "#f5a524" },
  { name: "Neon City United", short: "NCU", color: "#d14bff" },
  { name: "Harbor Lights SC", short: "HLS", color: "#12a594" },
  { name: "Iron Peak Wolves", short: "IPW", color: "#6e7891" },
  { name: "Sunfield Strikers", short: "SFS", color: "#ff7a1a" },
  { name: "Polar Coast Penguins", short: "PCP", color: "#1aa3d9" },
];
const FIRST = ["Theo", "Mateo", "Kai", "Jonas", "Leo", "Nico", "Ari", "Dax", "Remy", "Otto", "Felix", "Ezra", "Milo", "Zane", "Iker", "Bram", "Sami", "Tavi", "Rio", "Luca", "Emil", "Cass", "Juno", "Pax"];
const LAST1 = ["Vel", "Mar", "Dor", "Ka", "Bren", "Sol", "Quin", "Tor", "Fal", "Ren", "Ozz", "Lum", "Var", "Pell", "Strand", "Mir"];
const LAST2 = ["anco", "ito", "ssen", "ovic", "ard", "ez", "berg", "ani", "uro", "ley", "ston", "elli", "aro", "ström", "ada", "inho"];
const RARITIES = ["Common", "Rare", "Legend", "GOAT"];
const RLABEL = { Common: "Common", Rare: "Rare", Legend: "Legend", GOAT: "G.O.A.T." };
const RCOLOR = { Common: "#c7ced9", Rare: "#4aa8ff", Legend: "#ffd23f", GOAT: "#c58bff" };
const POS = ["GK", "DEF", "MID", "FWD"];
const PLAYERS = (() => {
  const r = rng(2027), out = [], used = new Set();
  const plan = [["GK", 6], ["DEF", 12], ["MID", 14], ["FWD", 16]];
  const rarityFor = (i) => (i % 16 === 3 ? "GOAT" : i % 7 === 2 ? "Legend" : i % 3 === 1 ? "Rare" : "Common");
  let i = 0;
  for (const [pos, n] of plan) for (let k = 0; k < n; k++, i++) {
    let name; do { name = `${FIRST[Math.floor(r() * FIRST.length)]} ${LAST1[Math.floor(r() * LAST1.length)]}${LAST2[Math.floor(r() * LAST2.length)]}`; } while (used.has(name)); used.add(name);

function rollRarity(q, r) {

    const pool = PLAYERS.filter((p) => p.rarity === rar);
    pulled.push(pool[Math.floor(r() * pool.length)]);

  pulled.sort((a, b) => RARITIES.indexOf(a.rarity) - RARITIES.indexOf(b.rarity));
  const fresh = pulled.map((p) => !S.owned[p.id]);
  pulled.forEach((p) => (S.owned[p.id] = (S.owned[p.id] || 0) + 1));

    <div class="row3">${pulled.map((p, i) => `<div class="flip" data-flip="${i}"><div class="in"><div class="back">W.C.O</div><div class="front">${cardHtml(p)}</div></div></div>`).join("")}</div>

/* ================================================================== team */
const SLOTS = [["FWD1", "FWD", 30, 13], ["FWD2", "FWD", 70, 13], ["MID", "MID", 50, 37.5], ["DEF", "DEF", 50, 62], ["GK", "GK", 50, 86.5]];
function teamRating() {
  const ids = SLOTS.map(([k]) => S.team[k]);
  const ovrs = ids.map((id) => (id === null ? 40 : byId(id).ovr));
  const base = ovrs.reduce((a, b) => a + b, 0) / ovrs.length;
  const clubs = {}; ids.filter((id) => id !== null).forEach((id) => (clubs[byId(id).club.short] = (clubs[byId(id).club.short] || 0) + 1));
  const chem = Math.min(4, Object.values(clubs).reduce((a, n) => a + (n > 1 ? n - 1 : 0), 0));

/* ================================================================== tournament
   Eight clubs, knockout. A match is decided by team rating plus luck: each side's
   chance of scoring comes from the difference in ratings, then the dice roll. */
const CPU = [["Quarry Town", 63, "#7a5cff"], ["Maple Rovers", 66, "#2fbf71"], ["Copper Bay", 69, "#e8833a"], ["Glacier FC", 72, "#5bc8f5"], ["Ember United", 75, "#ff5a4d"], ["Silver Comets", 79, "#b8c2d6"], ["Dragon Kings", 84, "#ffd23f"]];
let T = null;
function newTournament() {
  const me = { name: "My Dream Team", rating: teamRating().total, color: "#39ff88", me: true };
  const cpu = CPU.map(([name, rating, color]) => ({ name, rating, color }));
  // You meet the weakest first and the Dragon Kings last, like a real draw seeded by rank.
  const order = [me, cpu[0], cpu[3], cpu[4], cpu[1], cpu[5], cpu[2], cpu[6]];
  T = { rounds: [pairs(order)], round: 0, done: false, champion: null, playing: false };

function pairs(list) { const out = []; for (let i = 0; i < list.length; i += 2) out.push({ a: list[i], b: list[i + 1], sa: null, sb: null, pens: null, w: null }); return out; }

function scorerFor(team) {
  if (!team.me) return `${team.name} No. ${7 + Math.floor(Math.random() * 4)}`;
  const ids = [S.team.FWD1, S.team.FWD2, S.team.MID].filter((x) => x !== null);
  return ids.length ? byId(ids[Math.floor(Math.random() * ids.length)]).name : "Your striker";

async function playRound() {
  if (!T || T.done || T.playing) return;
  T.playing = true; renderTournament();
  const matches = T.rounds[T.round];
  const mine = matches.find((m) => m.a.me || m.b.me);
  for (const m of matches) if (m !== mine) sim(m);
  if (mine) { sim(mine); await animateMatch(mine); }

  if (winners.length === 1) {

  m.innerHTML = { obby: screenObby, cards: screenCards, team: screenTeam, cup: screenCup, turn: screenTurn }[state.tab]();
  if (state.tab === "obby") { sizeCanvas(); if (!G.obs.length) resetGame(); renderHud(); G.last = performance.now(); G.raf = requestAnimationFrame(loop); bindStage(); }
  if (state.tab === "cup") renderTournament();
  if (state.tab === "turn") paintTurn();
}
function bindStage() {
  const st = $("#stage"); if (!st) return;
  st.addEventListener("pointerdown", (e) => { e.preventDefault(); press(); });
  st.addEventListener("pointerup", release); st.addEventListener("pointercancel", release); st.addEventListener("pointerleave", release);
}
window.addEventListener("keydown", (e) => {
  if (state.tab !== "obby" || e.repeat) return;
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); press(); }
});
window.addEventListener("keyup", (e) => { if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") release(); });
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-card], [data-flip]"); if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.filter) { state.filter = t.dataset.filter; return render(); }
  if (t.dataset.card) return openCard(Number(t.dataset.card));
  if (t.dataset.slot) { state.picking = t.dataset.slot; return render(); }
  if (t.dataset.put) { S.team[state.picking] = Number(t.dataset.put); state.picking = null; save(); render(); return toast("In the team!"); }
  if ("cancelpick" in t.dataset) { state.picking = null; return render(); }
  if ("auto" in t.dataset) { autoPick(); render(); return toast(`Best team picked: rating ${teamRating().total}`); }
  if ("playround" in t.dataset) return playRound();
  if ("newcup" in t.dataset) { newTournament(); return render(); }
  if (t.dataset.flip !== undefined) return flip(Number(t.dataset.flip));
  if ("flipall" in t.dataset) { [0, 1, 2].forEach((i) => setTimeout(() => flip(i), i * 260)); return; }
  if ("closepack" in t.dataset) { $("#pack").classList.remove("open"); if (state.tab !== "obby") render(); return toast("Added to your collection. Check the Cards tab."); }
  if ("reset" in t.dataset) { if (confirm("Start over? This clears your cards on this device.")) { S = starter(); autoPick(); T = null; save(); render(); renderTabs(); } return; }
  if (t.dataset.ex) { const [asA, iWant, soThat] = EXAMPLES[t.dataset.ex]; state.story = { asA, iWant, soThat, feature: "" }; render(); return; }
  if (t.id === "s-send") {
    const s = state.story; if (!s.iWant.trim() || !s.soThat.trim()) return toast('Finish "I want to" and "so I can" first.');
    window.open(`/trail-crew/launch?story=${encodeURIComponent(JSON.stringify({ asA: s.asA, iWant: s.iWant, soThat: s.soThat, feature: "" }))}`, "_blank");
    return;
  }
  if ("close" in t.dataset) return $("#sheet").classList.remove("open");
  if (t.id === "brand") return openMade();
  if (t.id === "xray") { const on = document.body.classList.toggle("xray"); t.setAttribute("aria-pressed", on); return toast(on ? "X-ray on: see what the dragon slayer wrote, and what we built from it" : "X-ray off"); }
});
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("#sheet").classList.remove("open"); });
document.addEventListener("input", (e) => {
  const k = e.target.id?.startsWith("s-") && e.target.id.slice(2); if (!k || !(k in state.story)) return;
  state.story[k] = e.target.value; paintTurn();
});

renderTabs(); render();
if (S.starter) { S.starter = false; save(); setTimeout(() => toast("Welcome! Your starter pack is in the Cards tab, and your team is ready."), 600); }
</script>
